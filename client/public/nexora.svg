<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#2a1f7a"/>
      <stop offset="0.55" stop-color="#130f3d"/>
      <stop offset="1" stop-color="#0a0820"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.75"/>
      <stop offset="0.6" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#ff4f9a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff4f9a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="n" x1="0.1" y1="0.9" x2="0.9" y2="0.1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#ff7ab6"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <clipPath id="sq"><rect x="2" y="2" width="60" height="60" rx="15"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="64" height="64" fill="url(#bg)"/>
    <rect width="64" height="64" fill="url(#glow)"/>
    <rect width="64" height="64" fill="url(#glow2)"/>
    <ellipse cx="26" cy="4" rx="34" ry="13" fill="#fff" opacity="0.06"/>
  </g>
  <rect x="2.6" y="2.6" width="58.8" height="58.8" rx="14.4" fill="none" stroke="url(#rim)" stroke-width="1.2"/>
  <!-- the N: a path through four nodes -->
  <path d="M20 45V19l24 26V19" fill="none" stroke="url(#n)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.55" filter="url(#blur)"/>
  <path d="M20 45V19l24 26V19" fill="none" stroke="url(#n)" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="20" cy="45" r="4.4" fill="#0c0a24" stroke="#5eead4" stroke-width="2.4"/>
  <circle cx="20" cy="19" r="3.2" fill="#fff"/>
  <circle cx="44" cy="45" r="3.2" fill="#fff"/>
  <circle cx="44" cy="19" r="5.2" fill="#ff7ab6" opacity="0.5" filter="url(#blur)"/>
  <circle cx="44" cy="19" r="4.4" fill="#fff" stroke="#ff7ab6" stroke-width="2.4"/>
