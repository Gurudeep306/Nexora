    <script>
      /* Apply the whole look before the first paint, so the page never
         flashes the wrong theme, mode, accent, font or card style while React
         boots. The validator and its tables are injected by vite.config.ts
         from src/theme/look.ts — the same code ThemeProvider runs — so the
         two can never disagree. */
      (function () {
        var d = document.documentElement;
        var T = /*__LOOK_TABLES__*/{};
        var P = /*__PALETTE_MODES__*/{};
        var sanitize = /*__SANITIZE_LOOK__*/null;
        var raw = null;
        var appearance = 'system';
        try {
          raw = JSON.parse(localStorage.getItem('nexora:look') || 'null');
          var a = localStorage.getItem('nexora:appearance');
          if (a === 'light' || a === 'dark') appearance = a;
        } catch (e) { /* storage blocked or unreadable — defaults apply */ }
        var look = T.defaults;
        try { if (sanitize) look = sanitize(raw, T); } catch (e) {}
        /* Hive keeps its pre-journal look (theme/look.ts hiveLook). */
        if (look.style === 'journal' && T.v4 && /^\/hive(\/|$)/.test(location.pathname)) {
          var h = {};
          for (var k in look) h[k] = look[k];
          for (var j in T.v4.from) h[j] = T.v4.from[j];
          look = h;
        }
        var system = 'dark';
        try { if (matchMedia('(prefers-color-scheme: light)').matches) system = 'light'; } catch (e) {}
        var want = appearance === 'system' ? system : appearance;
        var modes = P[look.theme] || [1, 1];
        var mode = modes[want === 'dark' ? 0 : 1] ? want : modes[0] ? 'dark' : 'light';

        d.setAttribute('data-style', look.style);
        d.setAttribute('data-pattern', look.pattern);
        d.setAttribute('data-palette', look.theme);
        d.setAttribute('data-mode', mode);
        d.classList.toggle('dark', mode === 'dark');
        if (look.accent && look.accent !== 'theme') d.setAttribute('data-accent', look.accent);
        d.setAttribute('data-font', look.font);
        d.setAttribute('data-code-font', look.codeFont);
        d.setAttribute('data-solution-font', look.solutionFont);
        d.setAttribute('data-text-size', look.textSize);
        d.setAttribute('data-card-style', look.cardStyle);
        d.setAttribute('data-radius', look.radius);
        d.setAttribute('data-icon-set', look.iconSet);
        d.setAttribute('data-icon-style', look.iconStyle);
        d.setAttribute('data-icon-container', look.iconContainer);
        d.setAttribute('data-icon-shape', look.iconShape);
        var color = modes[mode === 'dark' ? 0 : 1];
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta && typeof color === 'string') meta.setAttribute('content', color);
      })();
    </script>
