<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/nexora.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1c1d22" />
    <meta name="description" content="Nexora — learn computer science end to end: animated courses, practice on a real judge, an AI tutor and career roadmaps." />
    <title>Nexora — Learn computer science, step by step</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Caveat:wght@400..700&family=Indie+Flower&family=JetBrains+Mono:wght@400;600;700&family=Kalam:wght@400;700&family=Playfair+Display:ital,wght@0,600;1,400&family=Press+Start+2P&display=swap" rel="stylesheet" />
    <script>
      /* Resolve the whole look before the first paint, so the page never
         flashes the wrong appearance, accent or desktop colour while React
         boots. Mirrors src/context/ThemeContext.tsx; the wallpaper table is
         injected from src/theme/catalog.ts by vite.config.ts. */
      (function () {
        var d = document.documentElement;
        try {
          var stored = localStorage.getItem('nexora:appearance');
          if (stored === 'light' || stored === 'dark') d.setAttribute('data-theme', stored);
          var dark = stored === 'light' || stored === 'dark'
            ? stored === 'dark'
            : matchMedia('(prefers-color-scheme: dark)').matches;
          d.classList.toggle('dark', dark);

          var W = /*__WALLPAPERS__*/{};
          var look = {};
          try { look = JSON.parse(localStorage.getItem('nexora:look') || '{}') || {}; } catch (e) {}
          var id = W[look.wallpaper] ? look.wallpaper : 'aurora';
          var w = W[id] || ['n', 'blue'];
          var tone = dark ? 'dark' : 'light', wallTone = tone, color = '', tint = '';
          if (w[0] === 'o') { color = dark ? w[2] : w[3]; tint = dark ? w[4] : w[5]; }
          else if (w[0] === 'p') { wallTone = w[2]; color = w[3]; tint = w[4]; }
          var accents = ' blue purple pink red orange yellow green graphite cyan ice plasma ';
          var accent = look.accent && accents.indexOf(' ' + look.accent + ' ') >= 0 ? look.accent : w[1];
          d.setAttribute('data-accent', accent);
          d.setAttribute('data-glass', /^(frosted|clear|solid)$/.test(look.glass) ? look.glass : 'frosted');
          d.setAttribute('data-card-style', look.cardStyle || 'glass');
          d.setAttribute('data-icon-pack', look.iconPack || 'vibrant');
          d.setAttribute('data-icon-shape', look.iconShape || 'squircle');
          d.setAttribute('data-font-style', look.fontStyle || 'modern');
          d.setAttribute('data-wall', w[0] === 'o' ? 'original' : w[0] === 'p' ? 'photo' : 'none');
          d.setAttribute('data-wall-tone', wallTone);
          if (color) {
            d.style.setProperty('--wall-color', color);
            d.style.setProperty('--wall-tint', tint);
          }
          if (w[0] === 'o') {
            /* Start fetching the desktop now rather than after the bundle. */
            var l = document.createElement('link');
            l.rel = 'preload';
            l.as = 'image';
            l.setAttribute('imagesrcset', '/wallpapers/' + id + '-' + tone + '-1280.webp 1280w, /wallpapers/' + id + '-' + tone + '.webp 2560w');
            l.setAttribute('imagesizes', '100vw');
            document.head.appendChild(l);
          }
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', dark ? '#1c1d22' : '#f2f2f5');
        } catch (e) { /* storage blocked — the CSS media query still applies */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
