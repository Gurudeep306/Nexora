# Runs on every push and pull request. Render waits for these checks to pass
# before deploying (autoDeployTrigger: checksPass in render.yaml), so a commit
# that breaks the server or the client build never reaches the live site.
name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PUPPETEER_SKIP_DOWNLOAD: "1"
  DISABLE_SCRAPER: "1"
  DISABLE_PUPPETEER: "1"

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Dependency audit (critical only)
        run: npm audit --omit=dev --audit-level=critical
      - name: Syntax check
        run: for f in src/*.js src/routes/*.js src/middleware/*.js scripts/*.js; do node --check "$f"; done
      # The GATE solution validator renders formulas with the client's KaTeX.
      - name: Client dependencies (for the GATE solution validator)
        run: npm ci --prefix client --no-audit --no-fund
      # GATE Notes: content validates (file:line errors) and src/gate/notes
      # matches the sources. npm test runs the same check; this step names it.
      - name: GATE notes pipeline (validate + up to date)
        run: npm run notes:check
      - name: Tests (incl. cloud-database end-to-end)
        run: npm test

  notes-checks:
    name: GATE notes verification scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install sympy
      - name: Run content/gate-notes/_checks
        run: python3 scripts/gate-notes/run_checks.py

  client:
    name: Client build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --prefix client --no-audit --no-fund
      - name: Lint
        run: npm run lint --prefix client
      - name: Type-check + build
        run: npm run build --prefix client
      # Cloudflare Pages limits: 20,000 files, 25 MiB per file. The GATE
      # figures (client/public/gate-fig → public/gate-fig) must be in dist.
      - name: Cloudflare Pages output check
        run: |
          n=$(find client/dist -type f | wc -l)
          echo "dist: $n files, $(du -sh client/dist | cut -f1)"
          test "$n" -lt 20000
          test -z "$(find client/dist -type f -size +25M)"
          test -f client/dist/_headers && test -f client/dist/_redirects
          test "$(find client/dist/gate-fig -type f | wc -l)" -gt 0
