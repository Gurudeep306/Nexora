<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230" fill="none" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <defs>
    <marker id="ga8-thin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="currentColor"/></marker>
    <marker id="ga8-thick" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
  </defs>
  <!-- axes -->
  <line x1="40" y1="110" x2="370" y2="110" stroke="currentColor" stroke-width="1.2" marker-start="url(#ga8-thin)" marker-end="url(#ga8-thin)"/>
  <line x1="160" y1="215" x2="160" y2="16" stroke="currentColor" stroke-width="1.2" marker-start="url(#ga8-thin)"/>
  <text x="378" y="105" fill="currentColor" font-style="italic">x</text>
  <text x="170" y="26" fill="currentColor" font-style="italic">y</text>
  <!-- guide lines to (2,-1) -->
  <line x1="280" y1="110" x2="280" y2="170" stroke="currentColor" stroke-width="1"/>
  <line x1="160" y1="170" x2="280" y2="170" stroke="currentColor" stroke-width="1"/>
  <text x="280" y="102" fill="currentColor" text-anchor="middle">(2, 0)</text>
  <text x="152" y="174" fill="currentColor" text-anchor="end">(0, −1)</text>
  <!-- thick function: x = 0 for y >= 0, x = -2y for y < 0 -->
  <line x1="160" y1="110" x2="160" y2="30" stroke="currentColor" stroke-width="5" marker-end="url(#ga8-thick)"/>
  <line x1="160" y1="110" x2="330" y2="195" stroke="currentColor" stroke-width="5" stroke-linecap="round" marker-end="url(#ga8-thick)"/>
</svg>
