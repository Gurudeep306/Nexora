<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 392" font-family="Arial, Helvetica, sans-serif" fill="none" stroke="currentColor" stroke-width="1.3">
  <title>4 KB memory built from four 1 KB blocks with a 2-to-4 decoder on IA4, IA3</title>
  <!-- address inputs (10 lines) into a bundle -->
  <g fill="currentColor" stroke="none" font-size="13" text-anchor="end">
    <text x="62" y="40">IA11</text>
    <text x="62" y="54">IA10</text>
    <text x="62" y="68">IA9</text>
    <text x="62" y="82">IA8</text>
    <text x="62" y="96">IA7</text>
    <text x="62" y="110">IA6</text>
    <text x="62" y="124">IA5</text>
    <text x="62" y="138">IA2</text>
    <text x="62" y="152">IA1</text>
    <text x="62" y="166">IA0</text>
  </g>
  <g>
    <line x1="66" y1="36" x2="110" y2="36"/>
    <line x1="66" y1="50" x2="110" y2="50"/>
    <line x1="66" y1="64" x2="110" y2="64"/>
    <line x1="66" y1="78" x2="110" y2="78"/>
    <line x1="66" y1="92" x2="110" y2="92"/>
    <line x1="66" y1="106" x2="110" y2="106"/>
    <line x1="66" y1="120" x2="110" y2="120"/>
    <line x1="66" y1="134" x2="110" y2="134"/>
    <line x1="66" y1="148" x2="110" y2="148"/>
    <line x1="66" y1="162" x2="110" y2="162"/>
    <line x1="110" y1="36" x2="110" y2="162"/>
  </g>
  <g fill="currentColor" stroke="none" font-size="11">
    <text x="88" y="28">MSB</text>
    <text x="88" y="180">LSB</text>
  </g>
  <!-- 10-bit address bus -->
  <g stroke-width="3.2" stroke-linejoin="round">
    <path d="M 110 50 H 715"/>
    <path d="M 200 50 V 190 H 250"/>
    <path d="M 395 50 V 190 H 410"/>
    <path d="M 555 50 V 190 H 570"/>
    <path d="M 715 50 V 190 H 730"/>
  </g>
  <line x1="214" y1="62" x2="228" y2="38" stroke-width="2"/>
  <text x="232" y="70" font-size="12" fill="currentColor" stroke="none">10-bit</text>
  <!-- memory blocks -->
  <g>
    <rect x="250" y="110" width="120" height="180"/>
    <rect x="410" y="110" width="120" height="180"/>
    <rect x="570" y="110" width="120" height="180"/>
    <rect x="730" y="110" width="120" height="180"/>
  </g>
  <g stroke-dasharray="4 3" stroke-width="1">
    <line x1="250" y1="264" x2="370" y2="264"/>
    <line x1="410" y1="264" x2="530" y2="264"/>
    <line x1="570" y1="264" x2="690" y2="264"/>
    <line x1="730" y1="264" x2="850" y2="264"/>
  </g>
  <g fill="currentColor" stroke="none" font-size="13">
    <text x="310" y="104" text-anchor="middle">1KB memory</text>
    <text x="470" y="104" text-anchor="middle">1KB memory</text>
    <text x="630" y="104" text-anchor="middle">1KB memory</text>
    <text x="790" y="104" text-anchor="middle">1KB memory</text>
    <text x="258" y="195">Addr</text>
    <text x="418" y="195">Addr</text>
    <text x="578" y="195">Addr</text>
    <text x="738" y="195">Addr</text>
    <text x="258" y="283">X1</text>
    <text x="418" y="283">X2</text>
    <text x="578" y="283">X3</text>
    <text x="738" y="283">X4</text>
    <text x="340" y="283" text-anchor="middle">CS</text>
    <text x="500" y="283" text-anchor="middle">CS</text>
    <text x="660" y="283" text-anchor="middle">CS</text>
    <text x="820" y="283" text-anchor="middle">CS</text>
  </g>
  <!-- decoder -->
  <rect x="150" y="300" width="80" height="76"/>
  <g fill="currentColor" stroke="none" font-size="13">
    <text x="190" y="294" text-anchor="middle">Decoder</text>
    <text x="156" y="327">A1</text>
    <text x="156" y="351">A0</text>
    <text x="226" y="316" text-anchor="end">Q0</text>
    <text x="226" y="333" text-anchor="end">Q1</text>
    <text x="226" y="350" text-anchor="end">Q2</text>
    <text x="226" y="367" text-anchor="end">Q3</text>
    <text x="96" y="327" text-anchor="end">IA4</text>
    <text x="96" y="351" text-anchor="end">IA3</text>
  </g>
  <line x1="100" y1="323" x2="150" y2="323"/>
  <line x1="100" y1="347" x2="150" y2="347"/>
  <!-- decoder outputs to chip selects -->
  <path d="M 230 312 H 340 V 290"/>
  <path d="M 230 329 H 500 V 290"/>
  <path d="M 230 346 H 660 V 290"/>
  <path d="M 230 363 H 820 V 290"/>
</svg>
