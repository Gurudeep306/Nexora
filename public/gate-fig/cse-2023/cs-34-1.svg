<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="Arial, Helvetica, sans-serif" fill="none" stroke="currentColor" stroke-width="1.3">
  <title>Two 4-input multiplexers M1, M2 feeding a 2-input multiplexer M3</title>
  <!-- M1 -->
  <rect x="150" y="40" width="80" height="150"/>
  <!-- M2 -->
  <rect x="150" y="280" width="80" height="150"/>
  <!-- M3 -->
  <rect x="340" y="160" width="80" height="150"/>
  <g fill="currentColor" stroke="none" font-size="14">
    <text x="190" y="32" text-anchor="middle">Multiplexer</text>
    <text x="190" y="272" text-anchor="middle">Multiplexer</text>
    <text x="380" y="152" text-anchor="middle">Multiplexer</text>
    <text x="196" y="80" text-anchor="middle" font-weight="600">M1</text>
    <text x="196" y="320" text-anchor="middle" font-weight="600">M2</text>
    <text x="384" y="208" text-anchor="middle" font-weight="600">M3</text>
    <!-- M1 input numbers and pins -->
    <text x="155" y="65">0</text>
    <text x="155" y="100">1</text>
    <text x="155" y="135">2</text>
    <text x="155" y="170">3</text>
    <text x="224" y="124" text-anchor="end">Q</text>
    <text x="182" y="185" text-anchor="middle" font-size="12">S1</text>
    <text x="210" y="185" text-anchor="middle" font-size="12">S0</text>
    <!-- M2 -->
    <text x="155" y="305">0</text>
    <text x="155" y="340">1</text>
    <text x="155" y="375">2</text>
    <text x="155" y="410">3</text>
    <text x="224" y="364" text-anchor="end">Q</text>
    <text x="182" y="425" text-anchor="middle" font-size="12">S1</text>
    <text x="210" y="425" text-anchor="middle" font-size="12">S0</text>
    <!-- M3 -->
    <text x="345" y="185">0</text>
    <text x="345" y="285">1</text>
    <text x="414" y="240" text-anchor="end">Q</text>
    <text x="390" y="305" text-anchor="middle" font-size="12">S</text>
    <!-- external labels -->
    <text x="52" y="65" text-anchor="end">X0</text>
    <text x="52" y="100" text-anchor="end">X1</text>
    <text x="52" y="135" text-anchor="end">X2</text>
    <text x="52" y="170" text-anchor="end">X3</text>
    <text x="52" y="215" text-anchor="end">A</text>
    <text x="52" y="240" text-anchor="end">C</text>
    <text x="52" y="305" text-anchor="end">X4</text>
    <text x="52" y="340" text-anchor="end">X5</text>
    <text x="52" y="375" text-anchor="end">X6</text>
    <text x="52" y="410" text-anchor="end">X7</text>
    <text x="52" y="455" text-anchor="end">A</text>
    <text x="52" y="480" text-anchor="end">C</text>
    <text x="52" y="505" text-anchor="end">B</text>
  </g>
  <!-- input dots -->
  <g fill="currentColor" stroke="none">
    <circle cx="60" cy="60" r="3"/><circle cx="60" cy="95" r="3"/><circle cx="60" cy="130" r="3"/><circle cx="60" cy="165" r="3"/>
    <circle cx="60" cy="210" r="3"/><circle cx="60" cy="235" r="3"/>
    <circle cx="60" cy="300" r="3"/><circle cx="60" cy="335" r="3"/><circle cx="60" cy="370" r="3"/><circle cx="60" cy="405" r="3"/>
    <circle cx="60" cy="450" r="3"/><circle cx="60" cy="475" r="3"/><circle cx="60" cy="500" r="3"/>
    <circle cx="500" cy="235" r="3"/>
  </g>
  <!-- data inputs -->
  <path d="M 60 60 H 150 M 60 95 H 150 M 60 130 H 150 M 60 165 H 150"/>
  <path d="M 60 300 H 150 M 60 335 H 150 M 60 370 H 150 M 60 405 H 150"/>
  <!-- selects of M1 (A -> S1, C -> S0) -->
  <path d="M 60 210 H 182 V 190"/>
  <path d="M 60 235 H 210 V 190"/>
  <!-- selects of M2 (A -> S1, C -> S0) -->
  <path d="M 60 450 H 182 V 430"/>
  <path d="M 60 475 H 210 V 430"/>
  <!-- M1, M2 outputs to M3 -->
  <path d="M 230 120 H 290 V 180 H 340"/>
  <path d="M 230 360 H 290 V 280 H 340"/>
  <!-- B -> select of M3 -->
  <path d="M 60 500 H 390 V 310"/>
  <!-- output -->
  <path d="M 420 235 H 500"/>
</svg>
