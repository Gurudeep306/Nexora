<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" font-family="Arial, Helvetica, sans-serif" fill="none" stroke="currentColor" role="img" aria-label="Undirected graph on vertices 1 to 5 with self-loops at vertices 3 and 4">
  <title>Graph with vertices 1–5: edges 3–5, 3–2, 5–4, 4–2, 2–1, and self-loops at 3 and 4</title>
  <g stroke-width="2" stroke-linecap="round">
    <line x1="160" y1="78" x2="90" y2="160" />
    <line x1="160" y1="78" x2="230" y2="160" />
    <line x1="90" y1="160" x2="160" y2="242" />
    <line x1="230" y1="160" x2="160" y2="242" />
    <line x1="230" y1="160" x2="310" y2="160" />
    <ellipse cx="160" cy="51" rx="14" ry="27" />
    <ellipse cx="160" cy="269" rx="14" ry="27" />
  </g>
  <g fill="currentColor" stroke="none">
    <circle cx="160" cy="78" r="6" />
    <circle cx="90" cy="160" r="6" />
    <circle cx="230" cy="160" r="6" />
    <circle cx="310" cy="160" r="6" />
    <circle cx="160" cy="242" r="6" />
  </g>
  <g fill="currentColor" stroke="none" font-size="20" font-weight="700" text-anchor="middle">
    <text x="160" y="106">3</text>
    <text x="72" y="186">5</text>
    <text x="236" y="188">2</text>
    <text x="312" y="188">1</text>
    <text x="160" y="228">4</text>
  </g>
</svg>
