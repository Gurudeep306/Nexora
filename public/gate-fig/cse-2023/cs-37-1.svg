<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 196" font-family="Arial, Helvetica, sans-serif" fill="none" stroke="currentColor" stroke-width="1.3">
  <title>Binary tree: root 10, left 5 (children 3, 8), right 11 (right child 13)</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L10,5 L0,9 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <!-- edges (parent -> child), trimmed to the circle radius 15 -->
  <line x1="140.6" y1="41.7" x2="99.4" y2="83.3" marker-end="url(#ah)"/>
  <line x1="159.4" y1="41.7" x2="200.6" y2="83.3" marker-end="url(#ah)"/>
  <line x1="81.9" y1="107.6" x2="58.1" y2="147.4" marker-end="url(#ah)"/>
  <line x1="98.1" y1="107.6" x2="121.9" y2="147.4" marker-end="url(#ah)"/>
  <line x1="218.1" y1="107.6" x2="241.9" y2="147.4" marker-end="url(#ah)"/>
  <!-- nodes -->
  <circle cx="150" cy="30" r="15"/>
  <circle cx="90" cy="95" r="15"/>
  <circle cx="210" cy="95" r="15"/>
  <circle cx="50" cy="160" r="15"/>
  <circle cx="130" cy="160" r="15"/>
  <circle cx="250" cy="160" r="15"/>
  <g fill="currentColor" stroke="none" font-size="14" text-anchor="middle" dominant-baseline="central">
    <text x="150" y="30">10</text>
    <text x="90" y="95">5</text>
    <text x="210" y="95">11</text>
    <text x="50" y="160">3</text>
    <text x="130" y="160">8</text>
    <text x="250" y="160">13</text>
  </g>
</svg>
