<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 160" role="img" aria-label="Undirected graph on vertices M, N, O (top row) and R, Q, P (bottom row) with edges M-N, N-O, M-R, M-Q, N-Q, O-Q, O-P, Q-P" font-family="Arial, Helvetica, sans-serif" fill="none" stroke="currentColor">
