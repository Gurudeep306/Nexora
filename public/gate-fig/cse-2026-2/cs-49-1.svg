<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" role="img" aria-label="2:4 decoder Q driven by A and B feeding a 4-to-1 multiplexer M with select lines S1, S0 and output Y" fill="none" stroke="currentColor" stroke-width="1.8" font-family="Arial, Helvetica, sans-serif" font-size="20">
  <title>Decoder Q feeding multiplexer M</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0.8 L10,5 L0,9.2 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <!-- inputs A, B -->
  <line x1="45" y1="110" x2="150" y2="110" marker-end="url(#ah)"/>
  <line x1="45" y1="216" x2="150" y2="216" marker-end="url(#ah)"/>
  <!-- decoder Q -->
  <rect x="152" y="68" width="145" height="190"/>
  <!-- multiplexer M -->
  <rect x="483" y="68" width="145" height="190"/>
  <!-- D0 -> input 0, D3 -> input 3 -->
  <line x1="297" y1="92" x2="481" y2="92" marker-end="url(#ah)"/>
  <line x1="297" y1="238" x2="481" y2="238" marker-end="url(#ah)"/>
  <!-- constants 0 -> input 1, 1 -> input 2 -->
  <line x1="394" y1="137" x2="481" y2="137" marker-end="url(#ah)"/>
  <line x1="394" y1="186" x2="481" y2="186" marker-end="url(#ah)"/>
  <!-- select lines -->
  <line x1="508" y1="38" x2="508" y2="66" marker-end="url(#ah)"/>
  <line x1="598" y1="38" x2="598" y2="66" marker-end="url(#ah)"/>
  <!-- output Y -->
  <line x1="628" y1="167" x2="728" y2="167" marker-end="url(#ah)"/>
  <g fill="currentColor" stroke="none">
    <text x="12" y="117">A</text>
    <text x="12" y="223">B</text>
    <text x="215" y="174">Q</text>
    <g text-anchor="end">
      <text x="289" y="99">D0</text>
      <text x="289" y="146">D1</text>
      <text x="289" y="195">D2</text>
      <text x="289" y="245">D3</text>
      <text x="388" y="144">0</text>
      <text x="388" y="193">1</text>
    </g>
    <text x="490" y="99">0</text>
    <text x="490" y="144">1</text>
    <text x="490" y="193">2</text>
    <text x="490" y="245">3</text>
    <text x="545" y="174">M</text>
    <text x="508" y="30" text-anchor="middle">S1</text>
    <text x="598" y="30" text-anchor="middle">S0</text>
    <text x="734" y="174">Y</text>
  </g>
</svg>
