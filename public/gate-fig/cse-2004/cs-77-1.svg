<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none" stroke="currentColor" font-family="Arial, Helvetica, sans-serif">
  <title>Eight-vertex graph: outer diamond with an inner 4-cycle</title>
  <g stroke-width="2">
    <line x1="30" y1="120" x2="200" y2="30"/>
    <line x1="30" y1="120" x2="200" y2="210"/>
    <line x1="30" y1="120" x2="150" y2="85"/>
    <line x1="30" y1="120" x2="150" y2="155"/>
    <line x1="370" y1="120" x2="200" y2="30"/>
    <line x1="370" y1="120" x2="200" y2="210"/>
    <line x1="370" y1="120" x2="250" y2="85"/>
    <line x1="370" y1="120" x2="250" y2="155"/>
    <line x1="200" y1="30" x2="150" y2="85"/>
    <line x1="200" y1="30" x2="250" y2="85"/>
    <line x1="200" y1="210" x2="150" y2="155"/>
    <line x1="200" y1="210" x2="250" y2="155"/>
    <line x1="150" y1="85" x2="250" y2="85"/>
    <line x1="250" y1="85" x2="250" y2="155"/>
    <line x1="250" y1="155" x2="150" y2="155"/>
    <line x1="150" y1="155" x2="150" y2="85"/>
  </g>
  <g fill="currentColor" stroke="none">
    <circle cx="30" cy="120" r="7"/>
    <circle cx="370" cy="120" r="7"/>
    <circle cx="200" cy="30" r="7"/>
    <circle cx="200" cy="210" r="7"/>
    <circle cx="150" cy="85" r="7"/>
    <circle cx="250" cy="85" r="7"/>
    <circle cx="150" cy="155" r="7"/>
    <circle cx="250" cy="155" r="7"/>
  </g>
</svg>
