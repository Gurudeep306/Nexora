<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 150" fill="none" stroke="currentColor" stroke-width="1.6" font-family="Arial, Helvetica, sans-serif">
  <!-- inputs to AND -->
  <line x1="40" y1="30" x2="90" y2="30"/>
  <line x1="40" y1="56" x2="90" y2="56"/>
  <text x="20" y="34" fill="currentColor" stroke="none" font-size="14">f<tspan font-size="10" dy="4">1</tspan></text>
  <text x="20" y="60" fill="currentColor" stroke="none" font-size="14">f<tspan font-size="10" dy="4">2</tspan></text>
  <!-- AND gate -->
  <path d="M90 16 H120 A27 27 0 0 1 120 70 H90 Z"/>
  <text x="112" y="47" fill="currentColor" stroke="none" font-size="11" text-anchor="middle">AND</text>
  <!-- AND output to XOR -->
  <line x1="147" y1="43" x2="190" y2="43"/>
  <!-- f3 to XOR -->
  <text x="20" y="122" fill="currentColor" stroke="none" font-size="14">f<tspan font-size="10" dy="4">3</tspan></text>
  <polyline points="40,118 175,118 175,69 190,69"/>
  <!-- XOR gate -->
  <path d="M178 32 Q196 56 178 80"/>
  <path d="M186 32 Q204 56 186 80 Q230 80 252 56 Q230 32 186 32 Z"/>
  <text x="220" y="60" fill="currentColor" stroke="none" font-size="11" text-anchor="middle">XOR</text>
  <!-- output -->
  <line x1="252" y1="56" x2="300" y2="56"/>
  <text x="310" y="61" fill="currentColor" stroke="none" font-size="14">f</text>
</svg>
