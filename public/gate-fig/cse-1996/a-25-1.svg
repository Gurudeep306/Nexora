<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 90" fill="none" stroke="currentColor" font-family="Arial, Helvetica, sans-serif" font-size="13" role="img" aria-label="Fig. 1.25: 32-bit word. Bits 31 to 24 hold the Exponent (8 bits); bits 23 to 0 hold the Mantissa (24 bits).">
  <rect x="20" y="30" width="400" height="30" stroke-width="1.6"/>
  <line x1="120" y1="30" x2="120" y2="60" stroke-width="1.6"/>
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="22" y="22" text-anchor="start">31</text>
    <text x="108" y="22">24</text>
    <text x="134" y="22">23</text>
    <text x="418" y="22" text-anchor="end">0</text>
    <text x="70" y="50" font-weight="bold">Exponent</text>
    <text x="270" y="50" font-weight="bold">Mantissa</text>
    <text x="220" y="82" font-size="12" font-weight="bold">Fig. 1.25</text>
  </g>
</svg>
