<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" fill="none" stroke="currentColor" stroke-width="1.6" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <title>Fig. 2.21: 4-bit binary adder with an AND gate feeding one operand bit</title>
  <rect x="120" y="150" width="300" height="100"/>
  <g fill="currentColor" stroke="none">
    <text x="270" y="185" text-anchor="middle">4-bit</text>
    <text x="270" y="205" text-anchor="middle">Binary</text>
    <text x="270" y="225" text-anchor="middle">Adder</text>
    <text x="160" y="62" text-anchor="middle">0</text>
    <text x="210" y="62" text-anchor="middle">0</text>
    <text x="235" y="62" text-anchor="middle">0</text>
    <text x="320" y="22" text-anchor="middle">b<tspan font-size="10" dy="3">3</tspan></text>
    <text x="345" y="22" text-anchor="middle">b<tspan font-size="10" dy="3">2</tspan></text>
    <text x="370" y="22" text-anchor="middle">b<tspan font-size="10" dy="3">1</tspan></text>
    <text x="395" y="22" text-anchor="middle">b<tspan font-size="10" dy="3">0</tspan></text>
    <text x="410" y="205" text-anchor="end">C<tspan font-size="10" dy="3">in</tspan></text>
    <text x="482" y="205">0</text>
    <text x="130" y="205">C<tspan font-size="10" dy="3">out</tspan></text>
    <text x="70" y="312" text-anchor="middle">d<tspan font-size="10" dy="3">4</tspan></text>
    <text x="230" y="312" text-anchor="middle">d<tspan font-size="10" dy="3">3</tspan></text>
    <text x="255" y="312" text-anchor="middle">d<tspan font-size="10" dy="3">2</tspan></text>
    <text x="280" y="312" text-anchor="middle">d<tspan font-size="10" dy="3">1</tspan></text>
    <text x="305" y="312" text-anchor="middle">d<tspan font-size="10" dy="3">0</tspan></text>
    <circle cx="185" cy="90" r="2.5"/>
    <circle cx="320" cy="80" r="2.5"/>
    <circle cx="345" cy="100" r="2.5"/>
  </g>
  <!-- first operand (MSB to LSB): 0, AND output, 0, 0 -->
  <line x1="160" y1="70" x2="160" y2="150"/>
  <line x1="185" y1="90" x2="185" y2="150"/>
  <line x1="210" y1="70" x2="210" y2="150"/>
  <line x1="235" y1="70" x2="235" y2="150"/>
  <!-- AND gate facing left -->
  <path d="M300 70 L270 70 A20 20 0 0 0 270 110 L300 110 Z"/>
  <line x1="250" y1="90" x2="185" y2="90"/>
  <line x1="300" y1="80" x2="320" y2="80"/>
  <line x1="300" y1="100" x2="345" y2="100"/>
  <!-- second operand b3..b0 -->
  <line x1="320" y1="30" x2="320" y2="150"/>
  <line x1="345" y1="30" x2="345" y2="150"/>
  <line x1="370" y1="30" x2="370" y2="150"/>
  <line x1="395" y1="30" x2="395" y2="150"/>
  <!-- carry in / out, sum outputs -->
  <line x1="420" y1="200" x2="470" y2="200"/>
  <polyline points="120,200 70,200 70,290"/>
  <line x1="230" y1="250" x2="230" y2="290"/>
  <line x1="255" y1="250" x2="255" y2="290"/>
  <line x1="280" y1="250" x2="280" y2="290"/>
  <line x1="305" y1="250" x2="305" y2="290"/>
</svg>
