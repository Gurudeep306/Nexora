<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" fill="none" stroke="currentColor" stroke-width="1.6" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <title>Fig. 2.22: 4-to-1 multiplexer</title>
  <rect x="100" y="30" width="170" height="190"/>
  <g fill="currentColor" stroke="none">
    <text x="185" y="62" text-anchor="middle">4 to 1</text>
    <text x="185" y="82" text-anchor="middle">Multiplexer</text>
    <text x="110" y="65">0</text>
    <text x="110" y="105">1</text>
    <text x="110" y="145">2</text>
    <text x="110" y="185">3</text>
    <text x="40" y="65" text-anchor="end">C</text>
    <text x="40" y="105" text-anchor="end">C</text>
    <text x="40" y="145" text-anchor="end">C</text>
    <text x="40" y="185" text-anchor="end">C</text>
    <text x="185" y="210" text-anchor="middle">S<tspan font-size="10" dy="3">1</tspan></text>
    <text x="225" y="210" text-anchor="middle">S<tspan font-size="10" dy="3">0</tspan></text>
    <text x="185" y="272" text-anchor="middle">A</text>
    <text x="225" y="272" text-anchor="middle">B</text>
    <text x="330" y="130">f</text>
  </g>
  <!-- complement bars over the C inputs 1 and 2 -->
  <line x1="30" y1="88" x2="41" y2="88" stroke-width="1.2"/>
  <line x1="30" y1="128" x2="41" y2="128" stroke-width="1.2"/>
  <line x1="48" y1="60" x2="100" y2="60"/>
  <line x1="48" y1="100" x2="100" y2="100"/>
  <line x1="48" y1="140" x2="100" y2="140"/>
  <line x1="48" y1="180" x2="100" y2="180"/>
  <line x1="185" y1="255" x2="185" y2="220"/>
  <line x1="225" y1="255" x2="225" y2="220"/>
  <line x1="270" y1="125" x2="322" y2="125"/>
</svg>
