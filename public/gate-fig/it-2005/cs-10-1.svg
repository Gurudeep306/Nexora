<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" fill="none" stroke="currentColor" stroke-width="2" font-family="Arial, Helvetica, sans-serif">
  <!-- Switch S1 -->
  <circle cx="120" cy="90" r="45"/>
  <line x1="75" y1="90" x2="112" y2="90"/>
  <line x1="140" y1="62" x2="118" y2="82"/>
  <line x1="140" y1="118" x2="118" y2="98"/>
  <!-- Switch S2 -->
  <circle cx="400" cy="90" r="45"/>
  <line x1="445" y1="90" x2="408" y2="90"/>
  <line x1="380" y1="62" x2="402" y2="82"/>
  <line x1="380" y1="118" x2="402" y2="98"/>
  <!-- b-b and c-c wires -->
  <polyline points="140,62 165,46 355,46 380,62"/>
  <polyline points="140,118 165,134 355,134 380,118"/>
  <!-- outer loop with bulb and battery -->
  <polyline points="75,90 30,90 30,215 198,215"/>
  <circle cx="220" cy="215" r="22"/>
  <polyline points="242,215 330,215"/>
  <line x1="330" y1="198" x2="330" y2="232"/>
  <line x1="342" y1="205" x2="342" y2="225" stroke-width="4"/>
  <polyline points="342,215 490,215 490,90 445,90"/>
  <g fill="currentColor" stroke="none" font-size="14">
    <text x="62" y="82">a</text>
    <text x="136" y="40">b</text>
    <text x="136" y="152">c</text>
    <text x="452" y="82">a</text>
    <text x="376" y="40">b</text>
    <text x="376" y="152">c</text>
    <text x="120" y="172" text-anchor="middle">Switch S1</text>
    <text x="400" y="172" text-anchor="middle">Switch S2</text>
    <text x="220" y="219" text-anchor="middle" font-size="12">Bulb</text>
  </g>
</svg>
