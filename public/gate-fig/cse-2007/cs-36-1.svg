<line x1="460" y1="195" x2="382" y2="195" marker-end="url(#c36ar)"/>
<line x1="460" y1="220" x2="382" y2="220" marker-end="url(#c36ar)"/>
</g>
<g fill="currentColor">
<circle cx="250" cy="100" r="4"/><circle cx="330" cy="120" r="4"/>
