<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" fill="none" stroke="currentColor" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <!-- start arrow -->
  <line x1="30" y1="170" x2="78" y2="170" stroke-width="1.6" marker-end="url(#ah)"/>
  <!-- states -->
  <circle cx="110" cy="170" r="28" stroke-width="1.8"/>
  <circle cx="280" cy="170" r="28" stroke-width="1.8"/>
  <circle cx="280" cy="170" r="23" stroke-width="1.4"/>
  <circle cx="450" cy="170" r="28" stroke-width="1.8"/>
  <circle cx="450" cy="170" r="23" stroke-width="1.4"/>
  <circle cx="400" cy="50" r="28" stroke-width="1.8"/>
  <g fill="currentColor" stroke="none" font-size="18" text-anchor="middle">
    <text x="110" y="176">q<tspan font-size="12" dy="4">0</tspan></text>
    <text x="280" y="176">q<tspan font-size="12" dy="4">1</tspan></text>
    <text x="450" y="176">q<tspan font-size="12" dy="4">2</tspan></text>
    <text x="400" y="56">q<tspan font-size="12" dy="4">3</tspan></text>
  </g>
  <!-- self loops -->
  <path d="M98 145 C 85 105, 135 105, 122 145" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M268 145 C 255 105, 305 105, 292 145" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M476 160 C 520 145, 520 195, 476 180" stroke-width="1.6" marker-end="url(#ah)"/>
  <!-- q0 -a-> q1 -->
  <line x1="138" y1="170" x2="250" y2="170" stroke-width="1.6" marker-end="url(#ah)"/>
  <!-- q1 -a-> q2 (upper) -->
  <path d="M306 160 Q 365 140 422 160" stroke-width="1.6" marker-end="url(#ah)"/>
  <!-- q2 -a-> q1 (lower) -->
  <path d="M424 182 Q 365 210 306 182" stroke-width="1.6" marker-end="url(#ah)"/>
  <!-- q3 -a-> q1 -->
  <line x1="376" y1="64" x2="302" y2="150" stroke-width="1.6" marker-end="url(#ah)"/>
  <!-- q3 -b-> q2 -->
  <line x1="414" y1="74" x2="438" y2="141" stroke-width="1.6" marker-end="url(#ah)"/>
  <g fill="currentColor" stroke="none" font-size="17" font-style="italic" text-anchor="middle">
    <text x="110" y="104">b</text>
    <text x="280" y="104">b</text>
    <text x="522" y="176">b</text>
    <text x="194" y="190">a</text>
    <text x="365" y="141">a</text>
    <text x="365" y="218">a</text>
    <text x="330" y="96">a</text>
    <text x="440" y="104">b</text>
  </g>
</svg>
