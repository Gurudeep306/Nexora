<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" fill="none" stroke="currentColor" font-family="Arial, Helvetica, sans-serif">
  <title>Hasse diagram: a on top, b, c, d in the middle, e at the bottom; each middle element joined to a and to e</title>
  <g stroke-width="2">
    <line x1="150" y1="30" x2="60" y2="100"/>
    <line x1="150" y1="30" x2="150" y2="100"/>
    <line x1="150" y1="30" x2="240" y2="100"/>
    <line x1="60" y1="100" x2="150" y2="170"/>
    <line x1="150" y1="100" x2="150" y2="170"/>
    <line x1="240" y1="100" x2="150" y2="170"/>
  </g>
  <g stroke-width="2" fill="none">
    <circle cx="150" cy="30" r="5"/>
    <circle cx="60" cy="100" r="5"/>
    <circle cx="150" cy="100" r="5"/>
    <circle cx="240" cy="100" r="5"/>
    <circle cx="150" cy="170" r="5"/>
  </g>
  <g fill="currentColor" stroke="none" font-size="18" font-style="italic">
    <text x="150" y="18" text-anchor="middle">a</text>
    <text x="44" y="106" text-anchor="end">b</text>
    <text x="138" y="106" text-anchor="end">c</text>
    <text x="254" y="106">d</text>
    <text x="150" y="194" text-anchor="middle">e</text>
  </g>
</svg>
