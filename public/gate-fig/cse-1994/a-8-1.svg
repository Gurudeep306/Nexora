<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" fill="none" stroke="currentColor" stroke-width="2" font-family="Arial, Helvetica, sans-serif" font-size="16">
  <g fill="currentColor" stroke="none">
    <text x="24" y="45">A</text>
    <text x="24" y="65">B</text>
    <text x="24" y="115">C</text>
    <text x="24" y="175">D</text>
  </g>
  <!-- NAND 1: inputs A, B -->
  <path d="M120 30 H145 A20 20 0 0 1 145 70 H120 Z"/>
  <circle cx="169" cy="50" r="4"/>
  <line x1="40" y1="40" x2="120" y2="40"/>
  <line x1="40" y1="60" x2="120" y2="60"/>
  <!-- NAND 2: inputs NAND1 output, C -->
  <path d="M260 40 H285 A20 20 0 0 1 285 80 H260 Z"/>
  <circle cx="309" cy="60" r="4"/>
  <line x1="173" y1="50" x2="260" y2="50"/>
  <!-- C line with branch -->
  <line x1="40" y1="110" x2="230" y2="110"/>
  <circle cx="230" cy="110" r="3" fill="currentColor"/>
  <polyline points="260,70 230,70 230,150 260,150"/>
  <!-- NAND 3: inputs C, D -->
  <path d="M260 140 H285 A20 20 0 0 1 285 180 H260 Z"/>
  <circle cx="309" cy="160" r="4"/>
  <line x1="40" y1="170" x2="260" y2="170"/>
  <!-- NAND 4: output gate -->
  <polyline points="313,60 350,60 350,100 380,100"/>
  <polyline points="313,160 350,160 350,120 380,120"/>
  <path d="M380 90 H405 A20 20 0 0 1 405 130 H380 Z"/>
  <circle cx="429" cy="110" r="4"/>
  <line x1="433" y1="110" x2="495" y2="110"/>
</svg>
