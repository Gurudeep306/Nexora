<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" fill="none" stroke="currentColor" font-family="Arial, Helvetica, sans-serif" font-size="14" role="img" aria-label="Process state transition diagram: Start, Ready, Running, Terminated, Blocked">
  <defs>
    <marker id="a13" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 1 L10 5 L0 9 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <g stroke-width="2">
    <circle cx="70" cy="110" r="45"/>
    <circle cx="240" cy="110" r="45"/>
    <circle cx="410" cy="110" r="45"/>
    <circle cx="575" cy="110" r="45"/>
    <circle cx="325" cy="280" r="45"/>
    <line x1="115" y1="110" x2="193" y2="110" marker-end="url(#a13)"/>
    <line x1="285" y1="110" x2="363" y2="110" marker-end="url(#a13)"/>
    <line x1="455" y1="110" x2="528" y2="110" marker-end="url(#a13)"/>
    <line x1="390" y1="150" x2="347" y2="239" marker-end="url(#a13)"/>
    <line x1="303" y1="239" x2="261" y2="152" marker-end="url(#a13)"/>
  </g>
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <g font-weight="bold" font-size="15">
      <text x="70" y="115">Start</text>
      <text x="240" y="115">Ready</text>
      <text x="410" y="115">Running</text>
      <text x="575" y="106">Termi-</text>
      <text x="575" y="124">nated</text>
      <text x="325" y="285">Blocked</text>
    </g>
    <text x="154" y="40">Create</text>
    <text x="154" y="57">a new</text>
    <text x="154" y="74">process</text>
    <text x="324" y="92">Schedule</text>
    <text x="492" y="92">Exit</text>
    <text x="215" y="190">I/O complete</text>
    <text x="215" y="207">or resource</text>
    <text x="215" y="224">released</text>
    <text x="445" y="190">Wait for</text>
    <text x="445" y="207">I/O completion</text>
    <text x="445" y="224">or resource</text>
