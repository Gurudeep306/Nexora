<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 170" fill="none" font-family="Arial, Helvetica, sans-serif">
  <title>PDA transition diagram: q0 (start, accepting) loops on a,X/XX and a,Z/XZ; q0 to q1 on b,X/ε; q1 loops on b,X/ε; q1 to q2 (accepting) on ε,Z/Z</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <g stroke="currentColor" stroke-width="1.5">
    <!-- start arrow -->
    <line x1="40" y1="125" x2="100" y2="125" marker-end="url(#ah)"/>
    <!-- states -->
    <circle cx="120" cy="125" r="19"/>
    <circle cx="120" cy="125" r="14"/>
    <circle cx="250" cy="125" r="19"/>
    <circle cx="380" cy="125" r="19"/>
    <circle cx="380" cy="125" r="14"/>
    <!-- self loops -->
    <path d="M108 110 C 95 70, 145 70, 132 110" marker-end="url(#ah)"/>
    <path d="M238 110 C 225 70, 275 70, 262 110" marker-end="url(#ah)"/>
    <!-- transitions -->
    <line x1="139" y1="125" x2="229" y2="125" marker-end="url(#ah)"/>
    <line x1="269" y1="125" x2="359" y2="125" marker-end="url(#ah)"/>
  </g>
  <g fill="currentColor" font-size="14" font-style="italic" text-anchor="middle">
    <text x="120" y="42">a, X/XX</text>
    <text x="120" y="60">a, Z/XZ</text>
    <text x="250" y="60">b, X/ε</text>
    <text x="185" y="115">b, X/ε</text>
    <text x="315" y="115">ε, Z/Z</text>
  </g>
  <g fill="currentColor" font-size="11" text-anchor="middle">
    <text x="120" y="160">q0</text>
    <text x="250" y="160">q1</text>
    <text x="380" y="160">q2</text>
  </g>
</svg>
