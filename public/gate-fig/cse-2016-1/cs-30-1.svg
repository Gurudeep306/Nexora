<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="Arial, Helvetica, sans-serif" fill="none" stroke="currentColor">
  <title>Two cascaded 2-to-1 multiplexers</title>
  <desc>MUX 1 has input 0 tied to logic 0, input 1 driven by R, select s = P. Its output feeds input 1 of MUX 2. MUX 2 has input 0 driven by R-bar (from above), select s = Q, and output X.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <!-- MUX 1 -->
  <rect x="150" y="80" width="150" height="75" stroke-width="1.6"/>
  <!-- MUX 2 -->
  <rect x="390" y="80" width="150" height="75" stroke-width="1.6"/>
  <g fill="currentColor" stroke="none" font-size="17">
    <text x="160" y="111">0</text>
    <text x="160" y="137">1</text>
    <text x="240" y="111" text-anchor="middle">2−to−1</text>
    <text x="240" y="132" text-anchor="middle">MUX</text>
    <text x="240" y="151" text-anchor="middle" font-style="italic">s</text>
    <text x="400" y="111">0</text>
    <text x="400" y="137">1</text>
    <text x="480" y="111" text-anchor="middle">2−to−1</text>
    <text x="480" y="132" text-anchor="middle">MUX</text>
    <text x="480" y="151" text-anchor="middle" font-style="italic">s</text>
    <!-- external labels -->
    <text x="95" y="111" text-anchor="end">0</text>
    <text x="95" y="137" text-anchor="end" font-style="italic">R</text>
    <text x="240" y="225" text-anchor="middle" font-style="italic">P</text>
    <text x="480" y="225" text-anchor="middle" font-style="italic">Q</text>
    <text x="350" y="38" text-anchor="middle" font-style="italic">R</text>
    <text x="608" y="111" font-style="italic">X</text>
  </g>
  <!-- overbar on R (R-bar) -->
  <line x1="344" y1="20" x2="357" y2="20" stroke-width="1.4"/>
  <g stroke-width="1.4">
    <!-- MUX1 inputs -->
    <line x1="102" y1="105" x2="148" y2="105" marker-end="url(#ah)"/>
    <line x1="102" y1="131" x2="148" y2="131" marker-end="url(#ah)"/>
    <!-- MUX1 select P -->
    <line x1="240" y1="205" x2="240" y2="157" marker-end="url(#ah)"/>
    <!-- MUX1 output to MUX2 input 1 -->
    <line x1="300" y1="131" x2="388" y2="131" marker-end="url(#ah)"/>
    <!-- R-bar to MUX2 input 0 -->
    <polyline points="350,46 350,105 388,105" marker-end="url(#ah)"/>
    <!-- MUX2 select Q -->
    <line x1="480" y1="205" x2="480" y2="157" marker-end="url(#ah)"/>
    <!-- output X -->
    <line x1="540" y1="105" x2="600" y2="105" marker-end="url(#ah)"/>
  </g>
</svg>
