<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" fill="none" font-family="Arial, Helvetica, sans-serif">
  <title>K-map of f(w,x,y,z): columns wx = 00,01,11,10; rows yz = 00,01,11,10. Row 00: 0 1 1 0; row 01: x 0 0 1; row 11: x 0 0 1; row 10: 0 1 1 x (x = don't care)</title>
  <g stroke="currentColor" stroke-width="1.5">
    <line x1="30" y1="20" x2="80" y2="60"/>
    <rect x="80" y="60" width="200" height="176" stroke-width="2"/>
    <line x1="130" y1="60" x2="130" y2="236"/>
    <line x1="180" y1="60" x2="180" y2="236"/>
    <line x1="230" y1="60" x2="230" y2="236"/>
    <line x1="80" y1="104" x2="280" y2="104"/>
    <line x1="80" y1="148" x2="280" y2="148"/>
    <line x1="80" y1="192" x2="280" y2="192"/>
  </g>
  <g fill="currentColor" font-size="15" text-anchor="middle">
    <text x="62" y="28" font-style="italic">wx</text>
    <text x="30" y="58" font-style="italic">yz</text>
    <text x="105" y="50">00</text><text x="155" y="50">01</text><text x="205" y="50">11</text><text x="255" y="50">10</text>
    <text x="60" y="87">00</text><text x="60" y="131">01</text><text x="60" y="175">11</text><text x="60" y="219">10</text>
  </g>
  <g fill="currentColor" font-size="18" text-anchor="middle">
    <text x="105" y="88">0</text><text x="155" y="88">1</text><text x="205" y="88">1</text><text x="255" y="88">0</text>
    <text x="105" y="132">x</text><text x="155" y="132">0</text><text x="205" y="132">0</text><text x="255" y="132">1</text>
    <text x="105" y="176">x</text><text x="155" y="176">0</text><text x="205" y="176">0</text><text x="255" y="176">1</text>
    <text x="105" y="220">0</text><text x="155" y="220">1</text><text x="205" y="220">1</text><text x="255" y="220">x</text>
  </g>
</svg>
