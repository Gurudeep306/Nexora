<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" fill="none" font-family="Arial, Helvetica, sans-serif" font-size="16" role="img" aria-label="Undirected weighted graph on five vertices">
  <g stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
    <line x1="150" y1="40" x2="62" y2="80"/>
    <line x1="150" y1="40" x2="238" y2="80"/>
    <line x1="62" y1="80" x2="100" y2="170"/>
    <line x1="150" y1="40" x2="100" y2="170"/>
    <line x1="150" y1="40" x2="180" y2="170"/>
    <line x1="100" y1="170" x2="180" y2="170"/>
    <line x1="238" y1="80" x2="180" y2="170"/>
  </g>
  <g stroke="currentColor" stroke-width="2.4">
    <circle cx="150" cy="40" r="15"/>
    <circle cx="62" cy="80" r="15"/>
    <circle cx="238" cy="80" r="15"/>
    <circle cx="100" cy="170" r="15"/>
    <circle cx="180" cy="170" r="15"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="98" y="48">4</text>
    <text x="204" y="50">x</text>
    <text x="64" y="133">4</text>
    <text x="114" y="104">1</text>
    <text x="178" y="104">3</text>
    <text x="140" y="198">4</text>
    <text x="226" y="138">5</text>
  </g>
</svg>
