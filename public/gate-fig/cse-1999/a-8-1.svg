<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 210" font-family="Arial, Helvetica, sans-serif" fill="none" stroke="currentColor">
  <title>4-variable K-map: rows AB = 00, 01, 11, 10; columns CD = 00, 01, 11, 10. Row 00: 0 0 1 0. Row 01: X X 1 X. Row 11: 0 1 1 0. Row 10: 0 1 1 0.</title>
  <g stroke-width="1.5">
    <rect x="20" y="10" width="225" height="190"/>
    <line x1="65" y1="10" x2="65" y2="200"/>
    <line x1="110" y1="10" x2="110" y2="200"/>
    <line x1="155" y1="10" x2="155" y2="200"/>
    <line x1="200" y1="10" x2="200" y2="200"/>
    <line x1="20" y1="48" x2="245" y2="48"/>
    <line x1="20" y1="86" x2="245" y2="86"/>
    <line x1="20" y1="124" x2="245" y2="124"/>
    <line x1="20" y1="162" x2="245" y2="162"/>
    <line x1="20" y1="10" x2="65" y2="48"/>
  </g>
  <g fill="currentColor" stroke="none" font-size="14" text-anchor="middle">
    <text x="52" y="25" font-size="12">CD</text>
    <text x="32" y="44" font-size="12">AB</text>
    <text x="87.5" y="34" font-weight="bold">00</text>
    <text x="132.5" y="34" font-weight="bold">01</text>
    <text x="177.5" y="34" font-weight="bold">11</text>
    <text x="222.5" y="34" font-weight="bold">10</text>
    <text x="42.5" y="72" font-weight="bold">00</text>
    <text x="42.5" y="110" font-weight="bold">01</text>
    <text x="42.5" y="148" font-weight="bold">11</text>
    <text x="42.5" y="186" font-weight="bold">10</text>
    <text x="87.5" y="72">0</text><text x="132.5" y="72">0</text><text x="177.5" y="72">1</text><text x="222.5" y="72">0</text>
    <text x="87.5" y="110">X</text><text x="132.5" y="110">X</text><text x="177.5" y="110">1</text><text x="222.5" y="110">X</text>
    <text x="87.5" y="148">0</text><text x="132.5" y="148">1</text><text x="177.5" y="148">1</text><text x="222.5" y="148">0</text>
    <text x="87.5" y="186">0</text><text x="132.5" y="186">1</text><text x="177.5" y="186">1</text><text x="222.5" y="186">0</text>
  </g>
</svg>
