<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" fill="none" stroke="currentColor" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <!-- arrival of interrupt -->
  <text x="130" y="22" text-anchor="middle" fill="currentColor" stroke="none">Arrival of</text>
  <text x="130" y="38" text-anchor="middle" fill="currentColor" stroke="none">interrupt input</text>
  <line x1="130" y1="44" x2="130" y2="100" stroke-width="1.5"/>
  <line x1="190" y1="50" x2="190" y2="100" stroke-dasharray="3 3"/>
  <line x1="132" y1="68" x2="188" y2="68" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="160" y="62" text-anchor="middle" fill="currentColor" stroke="none">10 µs</text>
  <!-- waveform: high = main program, low = interrupt handling -->
  <path d="M20 100 L190 100 L190 160 L325 160 M335 160 L490 160 L490 100 L640 100" stroke-width="2"/>
  <path d="M320 168 L328 150 L330 170 L338 152" stroke-width="1.5"/>
  <line x1="0" y1="100" x2="20" y2="100" stroke-dasharray="8 3 2 3" stroke-width="2"/>
  <!-- dimension line -->
  <line x1="0" y1="200" x2="640" y2="200" stroke-dasharray="10 4 2 4"/>
  <g stroke-dasharray="3 3">
    <line x1="190" y1="185" x2="190" y2="215"/>
    <line x1="250" y1="185" x2="250" y2="215"/>
    <line x1="430" y1="185" x2="430" y2="215"/>
    <line x1="490" y1="185" x2="490" y2="215"/>
  </g>
  <line x1="192" y1="200" x2="248" y2="200" marker-start="url(#ah)" marker-end="url(#ah)" stroke-width="1.5"/>
  <line x1="252" y1="200" x2="428" y2="200" marker-start="url(#ah)" marker-end="url(#ah)" stroke-width="1.5"/>
  <line x1="432" y1="200" x2="488" y2="200" marker-start="url(#ah)" marker-end="url(#ah)" stroke-width="1.5"/>
  <text x="220" y="230" text-anchor="middle" fill="currentColor" stroke="none">10 µs</text>
  <text x="340" y="192" text-anchor="middle" fill="currentColor" stroke="none">80 µs</text>
  <text x="460" y="230" text-anchor="middle" fill="currentColor" stroke="none">10 µs</text>
  <text x="80" y="188" text-anchor="middle" fill="currentColor" stroke="none">Main program</text>
  <text x="80" y="220" text-anchor="middle" fill="currentColor" stroke="none">execution</text>
  <text x="575" y="180" text-anchor="middle" fill="currentColor" stroke="none">Main program</text>
  <text x="575" y="222" text-anchor="middle" fill="currentColor" stroke="none">execution</text>
  <!-- pointers -->
  <path d="M120 280 L220 280 L220 240" marker-end="url(#ah)"/>
  <text x="70" y="276" text-anchor="middle" fill="currentColor" stroke="none">Saving of</text>
  <text x="70" y="292" text-anchor="middle" fill="currentColor" stroke="none">CPU state</text>
  <line x1="340" y1="282" x2="340" y2="212" marker-end="url(#ah)"/>
  <text x="340" y="300" text-anchor="middle" fill="currentColor" stroke="none">Interrupt Service</text>
  <text x="340" y="316" text-anchor="middle" fill="currentColor" stroke="none">Execution</text>
  <path d="M530 280 L460 280 L460 240" marker-end="url(#ah)"/>
  <text x="595" y="276" text-anchor="middle" fill="currentColor" stroke="none">Restoration of</text>
  <text x="595" y="292" text-anchor="middle" fill="currentColor" stroke="none">CPU state</text>
</svg>
