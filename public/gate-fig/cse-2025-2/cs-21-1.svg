<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 320" font-family="Arial, Helvetica, sans-serif" fill="none" stroke="currentColor" stroke-width="2">
  <title>Logic circuit: F = NAND(X, Y) + NOT X + (X AND NOT Y)</title>
  <!-- labels -->
  <g fill="currentColor" stroke="none" font-size="20" font-style="italic">
    <text x="24" y="30">Y</text>
    <text x="24" y="100">X</text>
    <text x="545" y="146">F</text>
  </g>
  <!-- input lines -->
  <line x1="10" y1="40" x2="280" y2="40"/>
  <line x1="10" y1="75" x2="280" y2="75"/>
  <!-- X branch: down to the middle NOT gate and the AND gate -->
  <polyline points="205,75 205,248 280,248"/>
  <line x1="205" y1="160" x2="280" y2="160"/>
  <!-- Y branch: down to the bottom NOT gate -->
  <polyline points="60,40 60,282 110,282"/>
  <!-- junction dots -->
  <g fill="currentColor" stroke="none">
    <circle cx="60" cy="40" r="5"/>
    <circle cx="205" cy="75" r="5"/>
    <circle cx="205" cy="160" r="5"/>
  </g>
  <!-- NAND gate (top, inputs Y and X) -->
  <path d="M280,25 H315 A33.5,33.5 0 0 1 315,92 H280 Z"/>
  <circle cx="352.5" cy="58.5" r="4"/>
  <polyline points="356.5,58.5 400,58.5 400,142 457,142"/>
  <!-- NOT gate (middle, input X) -->
  <path d="M280,135 L340,160 L280,185 Z"/>
  <circle cx="344" cy="160" r="4"/>
  <line x1="348" y1="160" x2="460" y2="160"/>
  <!-- NOT gate (bottom, input Y) -->
  <path d="M110,262 L165,282 L110,302 Z"/>
  <circle cx="169" cy="282" r="4"/>
  <line x1="173" y1="282" x2="280" y2="282"/>
  <!-- AND gate (bottom, inputs X and NOT Y) -->
  <path d="M280,232 H312 A33,33 0 0 1 312,298 H280 Z"/>
  <polyline points="345,265 400,265 400,178 457,178"/>
  <!-- OR gate (output F) -->
  <path d="M450,127 Q470,160 450,193 Q510,193 535,160 Q510,127 450,127 Z"/>
  <line x1="535" y1="160" x2="570" y2="160"/>
</svg>
