<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" fill="none" stroke="currentColor" stroke-width="2" font-family="Arial, Helvetica, sans-serif">
  <title>T flip-flop and D flip-flop with feedback, common clock</title>
  <!-- T flip-flop -->
  <rect x="130" y="50" width="100" height="150"/>
  <polygon points="130,112 142,120 130,128"/>
  <g fill="currentColor" stroke="none" font-size="17" font-weight="bold" text-anchor="middle">
    <text x="185" y="100">T</text>
    <text x="185" y="124">Flip-</text>
    <text x="185" y="148">Flop</text>
  </g>
  <!-- D flip-flop -->
  <rect x="350" y="55" width="100" height="150"/>
  <polygon points="350,122 362,130 350,138"/>
  <g fill="currentColor" stroke="none" font-size="17" font-weight="bold" text-anchor="middle">
    <text x="405" y="108">D</text>
    <text x="405" y="132">Flip-</text>
    <text x="405" y="156">Flop</text>
  </g>
  <!-- Q1: T output to D input -->
  <line x1="230" y1="70" x2="350" y2="70"/>
  <text x="275" y="98" fill="currentColor" stroke="none" font-size="17">Q<tspan font-size="12" dy="4">1</tspan></text>
  <!-- Q0: D output fed back over the top to T input -->
  <polyline points="450,70 495,70 495,22 95,22 95,70 130,70"/>
  <text x="468" y="98" fill="currentColor" stroke="none" font-size="17">Q<tspan font-size="12" dy="4">0</tspan></text>
  <!-- Common clock -->
  <polyline points="70,235 310,235 310,130 350,130"/>
  <polyline points="100,235 100,120 130,120"/>
  <circle cx="100" cy="235" r="3" fill="currentColor" stroke="none"/>
  <text x="18" y="240" fill="currentColor" stroke="none" font-size="15" font-weight="bold">Clock</text>
</svg>
