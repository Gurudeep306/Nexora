<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 215" role="img" aria-label="Option D: input A feeds the top input of AND gate G1 and, through a wire that hops over the B line, the bottom input of OR gate G2. Input B goes through a NOT gate; the inverted B feeds the bottom input of G1 and the top input of G2. The output of G1 goes through a NOT gate; that signal and the output of G2 feed AND gate G3, whose output goes through a final NOT gate to give F">
