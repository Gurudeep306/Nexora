<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" width="100%" height="100%">
  <defs>
    <filter id="glow-teal" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2dd4bf" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#0b1329" rx="16"/>
  <g transform="translate(180, 50)">
    <!-- Links from R -->
    <line x1="0" y1="20" x2="-80" y2="100" stroke="#94a3b8" stroke-width="2.5"/>
    <line x1="0" y1="20" x2="0" y2="100" stroke="#94a3b8" stroke-width="2.5"/>
    <line x1="0" y1="20" x2="80" y2="100" stroke="#94a3b8" stroke-width="2.5"/>

    <!-- Downward branches from X, Y, Z -->
    <line x1="-80" y1="120" x2="-100" y2="160" stroke="#94a3b8" stroke-width="2"/>
    <line x1="-80" y1="120" x2="-60" y2="160" stroke="#94a3b8" stroke-width="2"/>
    <text x="-80" y="185" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#94a3b8" font-weight="bold">···</text>

    <line x1="0" y1="120" x2="-15" y2="160" stroke="#94a3b8" stroke-width="2"/>
    <line x1="0" y1="120" x2="15" y2="160" stroke="#94a3b8" stroke-width="2"/>
    <text x="0" y="185" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#94a3b8" font-weight="bold">···</text>

    <line x1="80" y1="120" x2="60" y2="160" stroke="#94a3b8" stroke-width="2"/>
    <line x1="80" y1="120" x2="100" y2="160" stroke="#94a3b8" stroke-width="2"/>
    <text x="80" y="185" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#94a3b8" font-weight="bold">···</text>

    <!-- Upward links to Q and P -->
    <line x1="-50" y1="210" x2="-60" y2="260" stroke="#94a3b8" stroke-width="2"/>
    <line x1="50" y1="210" x2="60" y2="260" stroke="#94a3b8" stroke-width="2"/>

    <!-- Node R -->
    <circle cx="0" cy="15" r="16" fill="#38bdf8" stroke="#f8fafc" stroke-width="2.5" filter="url(#glow-teal)"/>
    <text x="0" y="-8" text-anchor="middle" font-family="sans-serif" font-size="16" font-style="italic" font-weight="bold" fill="#38bdf8">R</text>

    <!-- Node X -->
    <circle cx="-80" cy="110" r="14" fill="#818cf8" stroke="#f8fafc" stroke-width="2" filter="url(#glow-teal)"/>
    <text x="-105" y="115" font-family="sans-serif" font-size="15" font-style="italic" font-weight="bold" fill="#818cf8">X</text>

    <!-- Node Y -->
    <circle cx="0" cy="110" r="14" fill="#818cf8" stroke="#f8fafc" stroke-width="2" filter="url(#glow-teal)"/>
    <text x="-25" y="115" font-family="sans-serif" font-size="15" font-style="italic" font-weight="bold" fill="#818cf8">Y</text>

    <!-- Node Z -->
    <circle cx="80" cy="110" r="14" fill="#818cf8" stroke="#f8fafc" stroke-width="2" filter="url(#glow-teal)"/>
    <text x="102" y="115" font-family="sans-serif" font-size="15" font-style="italic" font-weight="bold" fill="#818cf8">Z</text>

    <!-- Node Q -->
    <circle cx="-60" cy="270" r="14" fill="#a78bfa" stroke="#f8fafc" stroke-width="2" filter="url(#glow-teal)"/>
    <text x="-85" y="275" font-family="sans-serif" font-size="15" font-style="italic" font-weight="bold" fill="#a78bfa">Q</text>

    <!-- Node P -->
    <circle cx="60" cy="270" r="14" fill="#a78bfa" stroke="#f8fafc" stroke-width="2" filter="url(#glow-teal)"/>
    <text x="82" y="275" font-family="sans-serif" font-size="15" font-style="italic" font-weight="bold" fill="#a78bfa">P</text>
  </g>
</svg>