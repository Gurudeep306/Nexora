<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" fill="none" stroke="currentColor" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Graph with vertices A to F and eight edges A-B, A-C, B-C, B-E, C-D, E-D, E-F, D-F; only MST edge weights shown: A-C 9, B-C 2, B-E 15, E-F 4, D-F 6">
  <g stroke-width="2">
    <line x1="60" y1="130" x2="150" y2="50"/>
    <line x1="60" y1="130" x2="150" y2="210"/>
    <line x1="150" y1="50" x2="150" y2="210"/>
    <line x1="150" y1="50" x2="310" y2="50"/>
