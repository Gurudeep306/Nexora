<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" fill="none" stroke="currentColor" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Control flow graph: block 1 (p=q+r; s=p+q; u=s*v) has edges to block 2 (v=r+u) and block 3 (q=s*u); blocks 2 and 3 both lead to block 4 (q=v+r); block 4 has a back edge to block 1">
  <defs>
    <marker id="a50" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <g stroke-width="1.5">
    <rect x="170" y="20" width="100" height="76"/>
    <rect x="40" y="150" width="100" height="34"/>
    <rect x="300" y="150" width="100" height="34"/>
    <rect x="170" y="240" width="100" height="34"/>
    <line x1="195" y1="96" x2="125" y2="148" marker-end="url(#a50)"/>
    <line x1="245" y1="96" x2="315" y2="148" marker-end="url(#a50)"/>
    <line x1="125" y1="184" x2="195" y2="238" marker-end="url(#a50)"/>
    <line x1="315" y1="184" x2="245" y2="238" marker-end="url(#a50)"/>
    <path d="M272 257 C 470 270, 470 40, 272 50" marker-end="url(#a50)"/>
  </g>
  <g fill="currentColor" stroke="none" font-size="15" text-anchor="middle" font-style="italic">
    <text x="220" y="42">p = q + r</text>
    <text x="220" y="64">s = p + q</text>
    <text x="220" y="86">u = s * v</text>
    <text x="90" y="172">v = r + u</text>
    <text x="350" y="172">q = s * u</text>
    <text x="220" y="262">q = v + r</text>
  </g>
  <g fill="currentColor" stroke="none" font-size="14" text-anchor="end">
    <text x="164" y="34">1</text>
    <text x="34" y="172">2</text>
    <text x="294" y="172">3</text>
    <text x="164" y="262">4</text>
  </g>
</svg>
