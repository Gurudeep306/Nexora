<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 170" fill="none">
  <title>Hasse diagram: p at bottom, t at top, q, r, s in the middle, each middle element joined to both p and t.</title>
  <g stroke="currentColor" stroke-width="1.6">
    <line x1="120" y1="20" x2="40" y2="85"/>
    <line x1="120" y1="20" x2="120" y2="150"/>
    <line x1="120" y1="20" x2="200" y2="85"/>
    <line x1="40" y1="85" x2="120" y2="150"/>
    <line x1="200" y1="85" x2="120" y2="150"/>
  </g>
  <g fill="currentColor">
    <circle cx="120" cy="20" r="4"/>
    <circle cx="40" cy="85" r="4"/>
    <circle cx="120" cy="85" r="4"/>
    <circle cx="200" cy="85" r="4"/>
    <circle cx="120" cy="150" r="4"/>
  </g>
  <g fill="currentColor" font-family="Arial, Helvetica, sans-serif" font-size="15" font-style="italic">
    <text x="120" y="11" text-anchor="middle">t</text>
    <text x="26" y="90" text-anchor="end">q</text>
    <text x="128" y="81">r</text>
    <text x="212" y="90">s</text>
    <text x="120" y="168" text-anchor="middle">p</text>
  </g>
</svg>
