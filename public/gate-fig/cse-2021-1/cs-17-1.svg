<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="currentColor" stroke="currentColor">
  <title>3 by 3 grid graph with edge weights 0.1 and 0.9</title>
  <g stroke-width="1.6" fill="none">
    <line x1="60" y1="40" x2="200" y2="40"/>
    <line x1="200" y1="40" x2="340" y2="40"/>
    <line x1="60" y1="130" x2="200" y2="130"/>
    <line x1="200" y1="130" x2="340" y2="130"/>
    <line x1="60" y1="220" x2="200" y2="220"/>
    <line x1="200" y1="220" x2="340" y2="220"/>
    <line x1="60" y1="40" x2="60" y2="130"/>
    <line x1="200" y1="40" x2="200" y2="130"/>
    <line x1="340" y1="40" x2="340" y2="130"/>
    <line x1="60" y1="130" x2="60" y2="220"/>
    <line x1="200" y1="130" x2="200" y2="220"/>
    <line x1="340" y1="130" x2="340" y2="220"/>
  </g>
  <g stroke="none">
    <circle cx="60" cy="40" r="9"/><circle cx="200" cy="40" r="9"/><circle cx="340" cy="40" r="9"/>
    <circle cx="60" cy="130" r="9"/><circle cx="200" cy="130" r="9"/><circle cx="340" cy="130" r="9"/>
    <circle cx="60" cy="220" r="9"/><circle cx="200" cy="220" r="9"/><circle cx="340" cy="220" r="9"/>
  </g>
  <g stroke="none" text-anchor="middle">
    <text x="130" y="31">0.1</text>
    <text x="270" y="31">0.1</text>
    <text x="130" y="121">0.1</text>
    <text x="270" y="121">0.9</text>
    <text x="130" y="246">0.9</text>
    <text x="270" y="246">0.1</text>
  </g>
  <g stroke="none" text-anchor="end">
    <text x="50" y="90">0.9</text>
    <text x="190" y="90">0.9</text>
    <text x="330" y="90">0.9</text>
    <text x="50" y="180">0.1</text>
    <text x="190" y="180">0.1</text>
    <text x="330" y="180">0.1</text>
  </g>
</svg>
