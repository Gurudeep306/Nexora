<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 130" role="img" aria-label="Dashed horizontal line AB with seven unit squares: one above the line, four touching it from below, two in the next row down" font-family="Arial, Helvetica, sans-serif">
  <line x1="10" y1="50" x2="350" y2="50" stroke="currentColor" stroke-width="1.5" stroke-dasharray="7 5"/>
  <g fill="none" stroke="currentColor" stroke-width="2">
    <rect x="130" y="20" width="30" height="30"/>
    <rect x="100" y="50" width="30" height="30"/>
    <rect x="130" y="50" width="30" height="30"/>
    <rect x="130" y="80" width="30" height="30"/>
    <rect x="190" y="50" width="30" height="30"/>
    <rect x="220" y="50" width="30" height="30"/>
    <rect x="220" y="80" width="30" height="30"/>
  </g>
  <g fill="currentColor" font-size="18" text-anchor="middle">
    <text x="30" y="40">A</text>
    <text x="320" y="40">B</text>
  </g>
</svg>
