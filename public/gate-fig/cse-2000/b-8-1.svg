<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 170" fill="none" stroke="currentColor" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <!-- start arrow -->
  <line x1="80" y1="55" x2="166" y2="55" stroke-width="1.5" marker-end="url(#ah)"/>
  <!-- states -->
  <circle cx="190" cy="55" r="22" stroke-width="1.5"/>
  <text x="190" y="61" text-anchor="middle" font-size="16" fill="currentColor" stroke="none">q<tspan font-size="11" dy="4">0</tspan></text>
  <circle cx="400" cy="55" r="22" stroke-width="1.5"/>
  <text x="400" y="61" text-anchor="middle" font-size="16" fill="currentColor" stroke="none">q<tspan font-size="11" dy="4">1</tspan></text>
  <!-- q0 -> q1 -->
  <line x1="212" y1="55" x2="376" y2="55" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="295" y="45" text-anchor="middle" font-size="15" fill="currentColor" stroke="none">2.s/s</text>
  <!-- self-loop on q0 -->
  <path d="M 180 75 C 150 130, 230 130, 200 75" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="140" y="140" text-anchor="middle" font-size="15" fill="currentColor" stroke="none">1.s/1.s</text>
  <!-- self-loop on q1 -->
  <path d="M 390 75 C 360 130, 440 130, 410 75" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="465" y="140" text-anchor="middle" font-size="15" fill="currentColor" stroke="none">1,1.s/s</text>
</svg>
