<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" fill="none" stroke="currentColor" stroke-width="2" font-family="Arial, Helvetica, sans-serif">
  <!-- JK flip-flop (output P) -->
  <rect x="100" y="80" width="90" height="85"/>
  <text x="108" y="72" fill="currentColor" stroke="none" font-size="16">P</text>
  <line x1="120" y1="80" x2="120" y2="40"/>
  <line x1="170" y1="80" x2="170" y2="62"/>
  <text x="108" y="157" fill="currentColor" stroke="none" font-size="15">J</text>
  <text x="168" y="157" fill="currentColor" stroke="none" font-size="15">K</text>
  <!-- J and K tied to logic 1 (wire hops over the clock line) -->
  <text x="40" y="200" fill="currentColor" stroke="none" font-size="16">1</text>
  <line x1="52" y1="194" x2="115" y2="194"/>
  <line x1="115" y1="165" x2="115" y2="194"/>
  <path d="M 115 194 L 133 194 A 12 12 0 0 0 157 194 L 175 194 L 175 165"/>
  <!-- clock to JK flip-flop -->
  <line x1="145" y1="165" x2="145" y2="240"/>
  <!-- D flip-flop (output Q) -->
  <rect x="300" y="80" width="90" height="85"/>
  <text x="300" y="72" fill="currentColor" stroke="none" font-size="16">Q</text>
  <line x1="315" y1="80" x2="315" y2="62"/>
  <line x1="360" y1="80" x2="360" y2="62"/>
  <text x="306" y="157" fill="currentColor" stroke="none" font-size="15">D</text>
  <!-- P to D -->
  <polyline points="120,40 245,40 245,205 315,205 315,165"/>
  <!-- clock to D flip-flop -->
  <line x1="350" y1="165" x2="350" y2="240"/>
  <!-- clock line -->
  <line x1="40" y1="240" x2="350" y2="240"/>
  <circle cx="145" cy="240" r="3" fill="currentColor"/>
  <text x="40" y="268" fill="currentColor" stroke="none" font-size="15">Clock</text>
</svg>
