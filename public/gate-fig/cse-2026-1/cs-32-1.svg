<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 520" role="img" aria-label="Control flow graph with basic blocks B1 to B5" fill="none" stroke="currentColor" stroke-width="1.6" font-family="Arial, Helvetica, sans-serif" font-size="17">
  <title>Control flow graph: ENTRY to B1; B1 to B2 and B3; B2 and B3 to B4; B4 to B5; B5 to EXIT</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0.8 L10,5 L0,9.2 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <!-- ENTRY -->
  <line x1="230" y1="10" x2="230" y2="58" marker-end="url(#ah)"/>
  <!-- blocks -->
  <rect x="180" y="60" width="100" height="38"/>
  <rect x="80" y="160" width="120" height="76"/>
  <rect x="250" y="160" width="120" height="58"/>
  <rect x="175" y="300" width="110" height="58"/>
  <rect x="175" y="420" width="110" height="38"/>
  <!-- edges -->
  <line x1="230" y1="98" x2="142" y2="158" marker-end="url(#ah)"/>
  <line x1="230" y1="98" x2="308" y2="158" marker-end="url(#ah)"/>
  <line x1="140" y1="236" x2="224" y2="298" marker-end="url(#ah)"/>
  <line x1="310" y1="218" x2="236" y2="298" marker-end="url(#ah)"/>
  <line x1="230" y1="358" x2="230" y2="418" marker-end="url(#ah)"/>
  <line x1="230" y1="458" x2="230" y2="506" marker-end="url(#ah)"/>
  <g fill="currentColor" stroke="none">
    <text x="240" y="28" font-size="14">ENTRY</text>
    <text x="240" y="500" font-size="14">EXIT</text>
    <text x="286" y="74" font-size="15">B1</text>
    <text x="206" y="174" font-size="15">B2</text>
    <text x="376" y="174" font-size="15">B3</text>
    <text x="291" y="314" font-size="15">B4</text>
    <text x="291" y="434" font-size="15">B5</text>
    <g font-style="italic" text-anchor="middle">
      <text x="230" y="85">a = b + i</text>
      <text x="140" y="184">a = g ∗ k</text>
      <text x="140" y="207">f = d − f</text>
      <text x="140" y="230">a = c ∗ 4</text>
      <text x="310" y="184">t = g ∗ k</text>
      <text x="310" y="208">b = c + m</text>
      <text x="230" y="324">x = g ∗ k</text>
      <text x="230" y="348">y = b + i</text>
      <text x="230" y="445">z = c + m</text>
    </g>
  </g>
</svg>
