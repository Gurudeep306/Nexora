<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 200" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Directed graph: P to Q, P to R, R to Q, S to Q, S to R">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="2">
    <!-- P -> Q -->
    <line x1="72" y1="40" x2="186" y2="40" marker-end="url(#ah)"/>
    <!-- P -> R -->
    <line x1="50" y1="62" x2="50" y2="136" marker-end="url(#ah)"/>
    <!-- R -> Q -->
    <line x1="67.6" y1="146.8" x2="192.4" y2="53.2" marker-end="url(#ah)"/>
    <!-- S -> Q -->
    <line x1="210" y1="138" x2="210" y2="64" marker-end="url(#ah)"/>
    <!-- S -> R -->
    <line x1="188" y1="160" x2="74" y2="160" marker-end="url(#ah)"/>
    <circle cx="50" cy="40" r="22"/>
    <circle cx="210" cy="40" r="22"/>
    <circle cx="50" cy="160" r="22"/>
    <circle cx="210" cy="160" r="22"/>
  </g>
  <g fill="currentColor" font-size="18" font-weight="bold" text-anchor="middle">
    <text x="50" y="46">P</text>
    <text x="210" y="46">Q</text>
    <text x="50" y="166">R</text>
    <text x="210" y="166">S</text>
  </g>
</svg>
