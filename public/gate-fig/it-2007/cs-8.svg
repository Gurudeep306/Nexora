<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230" fill="none" stroke="currentColor" stroke-width="2" font-family="Arial, Helvetica, sans-serif" font-size="16">
  <!-- MUX 1 -->
  <rect x="100" y="30" width="60" height="110"/>
  <!-- MUX 2 -->
  <rect x="220" y="30" width="60" height="110"/>
  <!-- inputs to MUX 1 -->
  <line x1="40" y1="60" x2="100" y2="60"/>
  <line x1="40" y1="110" x2="100" y2="110"/>
  <!-- MUX1 out to MUX2 input 1 -->
  <line x1="160" y1="60" x2="220" y2="60"/>
  <!-- X2 into MUX2 input 0 -->
  <polyline points="220,110 200,110 200,190"/>
  <!-- select lines -->
  <line x1="130" y1="140" x2="130" y2="190"/>
  <line x1="250" y1="140" x2="250" y2="190"/>
  <!-- output -->
  <line x1="280" y1="85" x2="340" y2="85"/>
  <g fill="currentColor" stroke="none">
    <text x="30" y="65" text-anchor="end">a</text>
    <text x="30" y="115" text-anchor="end">b</text>
    <text x="112" y="66">1</text>
    <text x="112" y="116">0</text>
    <text x="232" y="66">1</text>
    <text x="232" y="116">0</text>
    <text x="348" y="90">a.b</text>
    <text x="130" y="212" text-anchor="middle">X1</text>
    <text x="200" y="212" text-anchor="middle">X2</text>
    <text x="250" y="212" text-anchor="middle">X3</text>
  </g>
</svg>
