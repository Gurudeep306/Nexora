<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="currentColor">
<g stroke="currentColor" stroke-width="2" fill="none">
<!-- 1st Main Road (vertical): edges at x=200 and x=228 -->
<line x1="200" y1="10" x2="200" y2="166"/>
<line x1="200" y1="194" x2="200" y2="350"/>
<line x1="228" y1="10" x2="228" y2="166"/>
<line x1="228" y1="194" x2="228" y2="350"/>
<!-- 5th Cross Road (horizontal): edges at y=166 and y=194 -->
<line x1="20" y1="166" x2="200" y2="166"/>
<line x1="228" y1="166" x2="400" y2="166"/>
<line x1="20" y1="194" x2="200" y2="194"/>
<line x1="228" y1="194" x2="400" y2="194"/>
<!-- buildings -->
<rect x="54" y="48" width="114" height="44"/>
<rect x="54" y="104" width="114" height="44"/>
<rect x="250" y="48" width="114" height="44"/>
<rect x="250" y="104" width="114" height="44"/>
<rect x="54" y="214" width="114" height="44"/>
<rect x="54" y="268" width="114" height="44"/>
<rect x="250" y="210" width="114" height="54"/>
</g>
<text x="214" y="88" text-anchor="middle" transform="rotate(-90 214 88)" dominant-baseline="central">1st Main Road</text>
<text x="104" y="186" text-anchor="middle">5th Cross Road</text>
<g text-anchor="middle">
<text x="111" y="75">Library</text>
<text x="111" y="131">Physics Lab</text>
<text x="307" y="75">Canteen</text>
<text x="307" y="131">Hospital</text>
