<text x="111" y="295">Classrooms</text>
<text x="307" y="232">Chemistry</text>
<text x="307" y="252">Lab</text>
</g>
<!-- compass -->
<g stroke="currentColor" stroke-width="1.6" fill="none">
<line x1="380" y1="262" x2="380" y2="326"/>
<line x1="348" y1="294" x2="412" y2="294"/>
</g>
<g stroke="none">
<polygon points="380,256 375,267 385,267"/>
<polygon points="380,332 375,321 385,321"/>
<polygon points="342,294 353,289 353,299"/>
<polygon points="418,294 407,289 407,299"/>
