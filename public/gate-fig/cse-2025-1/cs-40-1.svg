<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 36 452 172" role="img" aria-label="Four-state DFA over a and b; the rightmost state is the only final state" fill="none" stroke="currentColor" stroke-width="1.6" font-family="Arial, Helvetica, sans-serif" font-size="17">
  <title>DFA of Q.50</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0.8 L10,5 L0,9.2 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <!-- start arrow -->
  <line x1="28" y1="110" x2="61" y2="110" marker-end="url(#ah)"/>
  <!-- states (left to right) -->
  <circle cx="80" cy="110" r="18"/>
  <circle cx="200" cy="110" r="18"/>
  <circle cx="320" cy="110" r="18"/>
  <circle cx="440" cy="110" r="18"/>
  <circle cx="440" cy="110" r="13.5"/>
  <!-- self-loops -->
  <path d="M71,94.5 C56,56 104,56 89,94.5" marker-end="url(#ah)"/>
  <path d="M191,94.5 C176,56 224,56 209,94.5" marker-end="url(#ah)"/>
  <!-- forward edges -->
  <line x1="98" y1="110" x2="181" y2="110" marker-end="url(#ah)"/>
  <line x1="218" y1="110" x2="301" y2="110" marker-end="url(#ah)"/>
  <line x1="338" y1="110" x2="421" y2="110" marker-end="url(#ah)"/>
  <!-- final state -a-> third state (upper arc) -->
  <path d="M436,92.5 C420,48 340,48 327,93" marker-end="url(#ah)"/>
  <!-- third state -a-> first state (lower arc) -->
  <path d="M314,127 C290,188 112,188 89,127" marker-end="url(#ah)"/>
  <!-- final state -b-> second state (lower arc) -->
  <path d="M434,127 C410,188 232,188 209,127" marker-end="url(#ah)"/>
  <g fill="currentColor" stroke="none" font-style="italic" text-anchor="middle">
    <text x="80" y="54">a</text>
    <text x="200" y="54">b</text>
    <text x="140" y="101">b</text>
    <text x="260" y="101">a</text>
    <text x="380" y="101">b</text>
    <text x="380" y="52">a</text>
    <text x="150" y="196">a</text>
    <text x="380" y="196">b</text>
  </g>
</svg>
