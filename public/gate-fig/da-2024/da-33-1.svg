<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 185" role="img" aria-label="Figure 1: a feed-forward network with inputs x1, x2, x3, a first hidden layer of 3 neurons (h1, h2, h3 top to bottom), a second hidden layer of 2 neurons and one output neuron. Input edges, all of weight 1: x1 to h1, x1 to h2, x1 to h3, x2 to h1, x2 to h3, x3 to h2, x3 to h3 (x2 is not connected to h2, x3 is not connected to h1). Every first-hidden neuron connects to both second-hidden neurons with weight 2, and both second-hidden neurons connect to the output with weight 3." fill="none" stroke="currentColor" stroke-width="1.6" font-family="Arial, Helvetica, sans-serif">
<title>Figure 1: a feed-forward network with inputs x1, x2, x3, a first hidden layer of 3 neurons (h1, h2, h3 top to bottom), a second hidden layer of 2 neurons and one output neuron. Input edges, all of weight 1: x1 to h1, x1 to h2, x1 to h3, x2 to h1, x2 to h3, x3 to h2, x3 to h3 (x2 is not connected to h2, x3 is not connected to h1). Every first-hidden neuron connects to both second-hidden neurons with weight 2, and both second-hidden neurons connect to the output with weight 3.</title>
