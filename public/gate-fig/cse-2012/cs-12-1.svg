<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" fill="none" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke="currentColor" stroke-width="2">
    <!-- start arrow -->
    <line x1="40" y1="90" x2="118" y2="90" marker-end="url(#ah)"/>
    <!-- states -->
    <circle cx="150" cy="90" r="30"/>
    <circle cx="350" cy="90" r="30"/>
    <circle cx="350" cy="90" r="24"/>
    <circle cx="550" cy="90" r="30"/>
    <!-- a: q0 -> q1 -->
    <line x1="180" y1="90" x2="318" y2="90" marker-end="url(#ah)"/>
    <!-- epsilon: q1 -> q2 -->
    <line x1="380" y1="90" x2="518" y2="90" marker-end="url(#ah)"/>
    <!-- epsilon: q2 -> q0 (curved below) -->
    <path d="M540 118 C 500 185, 200 185, 160 120" marker-end="url(#ah)"/>
  </g>
  <g fill="currentColor" font-size="22" text-anchor="middle">
    <text x="250" y="78">a</text>
    <text x="450" y="78">ε</text>
    <text x="350" y="200">ε</text>
  </g>
</svg>
