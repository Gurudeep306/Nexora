<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ExplainLab - Nexora Studio</title>
<link rel="stylesheet" href="/css/design-system.css">
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/css/explainlab.css">
<link rel="stylesheet" href="/css/animations.css">
<link rel="stylesheet" href="/css/z-index.css">
<link rel="stylesheet" href="/css/accessibility.css">
<link rel="stylesheet" href="/css/sidebar.css">
<link rel="stylesheet" href="/css/orbitdock.css">
<link rel="stylesheet" href="/css/neo-sidebar.css">
<link rel="stylesheet" href="/css/premium.css">
<link rel="stylesheet" href="/css/target-cursor.css">
<link rel="stylesheet" href="/css/magic-bento.css">
  <link rel="stylesheet" href="/css/sidebar-v2.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body class="explainlab-body dark-theme">
<!-- Top Toolbar -->
<header class="el-toolbar">
  <div class="el-toolbar-left">
    <a href="/studio" class="el-back-btn" title="Back to Studio">← Studio</a>
    <div class="el-session-info">
      <input type="text" id="sessionTitle" placeholder="Untitled Session" class="el-title-input">
      <select id="sessionLevel" class="el-select-sm">
        <option value="beginner">Beginner</option>
        <option value="intermediate">Intermediate</option>
        <option value="advanced">Advanced</option>
      </select>
    </div>
  </div>
  <div class="el-toolbar-center">
    <div class="el-recording-indicator" id="recordingIndicator">
      <span class="el-rec-dot"></span>
      <span id="recordingTimer">00:00</span>
    </div>
  </div>
  <div class="el-toolbar-right">
    <button class="el-btn el-btn-outline" id="btnSaveDraft" title="Save Draft">Save Draft</button>
    <button class="el-btn el-btn-primary" id="btnPublish" title="Publish">Publish</button>
  </div>
</header>

<!-- Main Layout -->
<div class="el-main">
  <!-- Left Tool Panel -->
  <aside class="el-left-panel">
    <div class="el-tool-group">
      <button class="el-tool-btn active" data-tool="pen" title="Pen (P)">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
      </button>
      <button class="el-tool-btn" data-tool="marker" title="Marker (M)">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>
      </button>
      <button class="el-tool-btn" data-tool="highlighter" title="Highlighter (H)">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-opacity="0.4"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>
      </button>
      <button class="el-tool-btn" data-tool="eraser" title="Eraser (E)">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20H7L3 16c-.8-.8-.8-2 0-2.8l10-10c.8-.8 2-.8 2.8 0l5 5c.8.8.8 2 0 2.8L14 18"/></svg>
      </button>
    </div>

    <div class="el-tool-group">
      <button class="el-tool-btn" data-tool="line" title="Line">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="20" x2="20" y2="4"/></svg>
      </button>
      <button class="el-tool-btn" data-tool="arrow" title="Arrow">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="20" x2="20" y2="4"/><polyline points="13 4 20 4 20 11"/></svg>
      </button>
      <button class="el-tool-btn" data-tool="rectangle" title="Rectangle">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
      </button>
      <button class="el-tool-btn" data-tool="circle" title="Circle">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>
      </button>
    </div>

    <div class="el-tool-group">
      <button class="el-tool-btn" data-tool="text" title="Text (T)">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3"/><path d="M12 4v16"/><path d="M8 20h8"/></svg>
      </button>
      <button class="el-tool-btn" data-tool="formula" title="Formula (F)">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><span style="font-size:14px;font-weight:bold">∑</span></svg>
      </button>
    </div>

    <div class="el-tool-group">
      <button class="el-tool-btn" data-tool="select" title="Select (V)">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg>
      </button>
    </div>

    <div class="el-tool-group el-color-group">
      <div class="el-color-picker">
        <input type="color" id="colorPicker" value="#000000" title="Color">
      </div>
      <div class="el-color-presets">
        <button class="el-color-dot" data-color="#000000" style="background:#000"></button>
        <button class="el-color-dot" data-color="#ef4444" style="background:#ef4444"></button>
        <button class="el-color-dot" data-color="#22c55e" style="background:#22c55e"></button>
        <button class="el-color-dot" data-color="#3b82f6" style="background:#3b82f6"></button>
        <button class="el-color-dot" data-color="#f59e0b" style="background:#f59e0b"></button>
        <button class="el-color-dot" data-color="#8b5cf6" style="background:#8b5cf6"></button>
      </div>
    </div>

    <div class="el-tool-group">
      <div class="el-slider-group">
        <label>Size</label>
        <input type="range" id="brushSize" min="1" max="20" value="3" class="el-slider">
        <span id="brushSizeValue">3</span>
      </div>
    </div>

    <div class="el-tool-group">
      <button class="el-tool-btn" id="btnUndo" title="Undo (Ctrl+Z)">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
      </button>
      <button class="el-tool-btn" id="btnRedo" title="Redo (Ctrl+Y)">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/></svg>
      </button>
    </div>

    <div class="el-tool-group">
      <button class="el-tool-btn" id="btnClearPage" title="Clear Page">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      </button>
    </div>
  </aside>

  <!-- Canvas Area -->
  <main class="el-canvas-area">
    <div class="el-canvas-container" id="canvasContainer">
      <canvas id="whiteboardCanvas"></canvas>
      <div class="el-canvas-overlay" id="canvasOverlay"></div>
    </div>

    <!-- Page Tabs -->
    <div class="el-page-tabs" id="pageTabs">
      <button class="el-page-tab active" data-page="0">Page 1</button>
      <button class="el-page-tab el-add-page" id="btnAddPage" title="Add Page">+</button>
    </div>
  </main>

  <!-- Right Panel -->
  <aside class="el-right-panel">
    <!-- Tabs -->
    <div class="el-panel-tabs">
      <button class="el-panel-tab active" data-tab="typed">Typed Notes</button>
      <button class="el-panel-tab" data-tab="handwritten">Handwritten</button>
      <button class="el-panel-tab" data-tab="explanation">Full Explanation</button>
      <button class="el-panel-tab" data-tab="markers">Markers</button>
    </div>

    <!-- Typed Notes Tab -->
    <div class="el-panel-content" id="panelTyped">
      <div class="el-editor-toolbar">
        <button class="el-editor-btn" data-cmd="bold" title="Bold"><b>B</b></button>
        <button class="el-editor-btn" data-cmd="italic" title="Italic"><i>I</i></button>
        <button class="el-editor-btn" data-cmd="underline" title="Underline"><u>U</u></button>
        <span class="el-editor-sep"></span>
        <button class="el-editor-btn" data-cmd="insertUnorderedList" title="Bullet List">• List</button>
        <button class="el-editor-btn" data-cmd="insertOrderedList" title="Numbered List">1. List</button>
        <span class="el-editor-sep"></span>
        <button class="el-editor-btn" data-cmd="formatBlock" data-value="h2" title="Heading">H2</button>
        <button class="el-editor-btn" data-cmd="formatBlock" data-value="h3" title="Subheading">H3</button>
        <span class="el-editor-sep"></span>
        <button class="el-editor-btn" data-cmd="formatBlock" data-value="pre" title="Code Block"></></button>
      </div>
      <div class="el-typed-editor" id="typedEditor" contenteditable="true" placeholder="Start typing your notes..."></div>
      <button class="el-btn el-btn-sm el-btn-outline" id="btnSaveTypedNotes">Save Notes</button>
    </div>

    <!-- Handwritten Notes Tab -->
    <div class="el-panel-content hidden" id="panelHandwritten">
      <div class="el-handwritten-list" id="handwrittenList">
        <p class="el-empty-state">No handwritten notes yet.</p>
      </div>
      <div class="el-handwritten-actions">
        <button class="el-btn el-btn-sm el-btn-outline" id="btnSaveCurrentPage">Save Current Page</button>
        <label class="el-btn el-btn-sm el-btn-outline">
          Upload Image
          <input type="file" id="btnUploadHandwritten" accept="image/*,.pdf" hidden>
        </label>
      </div>
    </div>

    <!-- Full Explanation Tab -->
    <div class="el-panel-content hidden" id="panelExplanation">
      <div class="el-editor-toolbar">
        <button class="el-editor-btn" data-cmd="bold" title="Bold"><b>B</b></button>
        <button class="el-editor-btn" data-cmd="italic" title="Italic"><i>I</i></button>
        <button class="el-editor-btn" data-cmd="formatBlock" data-value="h2" title="Heading">H2</button>
        <button class="el-editor-btn" data-cmd="formatBlock" data-value="h3" title="Subheading">H3</button>
      </div>
      <div class="el-explanation-editor" id="explanationEditor" contenteditable="true" placeholder="Write a comprehensive explanation..."></div>
      <button class="el-btn el-btn-sm el-btn-outline" id="btnSaveExplanation">Save Explanation</button>
    </div>

    <!-- Markers Tab -->
    <div class="el-panel-content hidden" id="panelMarkers">
      <div class="el-markers-list" id="markersList">
        <p class="el-empty-state">No markers yet. Add markers during recording to mark important moments.</p>
      </div>
      <button class="el-btn el-btn-sm el-btn-outline" id="btnAddMarker">+ Add Marker at Current Time</button>
    </div>
  </aside>
</div>

<!-- Bottom Recording Bar -->
<footer class="el-bottom-bar">
  <div class="el-bottom-left">
    <button class="el-btn el-btn-icon" id="btnRecord" title="Start Recording">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>
    </button>
    <button class="el-btn el-btn-icon hidden" id="btnPauseRecord" title="Pause Recording">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
    </button>
    <button class="el-btn el-btn-icon hidden" id="btnStopRecord" title="Stop Recording">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12"/></svg>
    </button>
    <span class="el-bottom-label" id="recordingStatus">Not recording</span>
  </div>
  <div class="el-bottom-center">
    <div class="el-timeline" id="timeline">
      <div class="el-timeline-progress" id="timelineProgress"></div>
      <div class="el-timeline-markers" id="timelineMarkers"></div>
    </div>
  </div>
  <div class="el-bottom-right">
    <select id="bgSelect" class="el-select-sm">
      <option value="white">White</option>
      <option value="grid">Grid</option>
      <option value="dotted">Dotted</option>
      <option value="ruled">Ruled</option>
      <option value="dark">Dark Board</option>
    </select>
  </div>
</footer>

<!-- Session Setup Modal -->
<div class="el-modal" id="setupModal">
  <div class="el-modal-content">
    <h2>Create New Explanation Session</h2>
    <form id="setupForm">
      <div class="el-form-group">
        <label>Session Title *</label>
        <input type="text" name="title" required placeholder="e.g., Introduction to Dynamic Programming">
      </div>
      <div class="el-form-group">
        <label>Description</label>
        <textarea name="description" rows="3" placeholder="Brief description of what this session covers..."></textarea>
      </div>
      <div class="el-form-row">
        <div class="el-form-group">
          <label>Explanation Type</label>
          <select name="explanation_type">
            <option value="lecture">Lecture</option>
            <option value="problem-solving">Problem Solving</option>
            <option value="code-walkthrough">Code Walkthrough</option>
            <option value="revision">Quick Revision</option>
            <option value="doubt-solving">Doubt Solving</option>
          </select>
        </div>
        <div class="el-form-group">
          <label>Level</label>
          <select name="level">
            <option value="beginner">Beginner</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>
          </select>
        </div>
      </div>
      <div class="el-form-group">
        <label>Attach to Problem (optional)</label>
        <input type="text" name="problem_id" placeholder="Problem ID or leave empty">
      </div>
      <div class="el-form-actions">
        <button type="submit" class="el-btn el-btn-primary">Create Session</button>
      </div>
    </form>
  </div>
</div>

<!-- Toast Notifications -->
<div class="el-toast-container" id="toastContainer"></div>

<!-- Scripts -->
<script src="/js/layout/theme.js" defer></script>
<!-- old cursor retired in favor of React Bits TargetCursor -->
<!-- <script src="/js/layout/cursor.js" defer></script> -->
<script src="/js/layout/sidebar-config.js" defer></script>
<script src="/js/layout/orbitdock.js" defer></script>
<script src="/js/layout/neo-sidebar.js" defer></script>
<script src="/js/explainlab/explainlab-api.js"></script>
<script src="/js/explainlab/whiteboard-engine.js"></script>
<script src="/js/explainlab/explainlab-app.js"></script>
<script src="/js/premium.js" defer></script>
<!-- React Bits ports (cursor + bento) -->
<script>window.__defBak = window.define; try { window.define = undefined; } catch (e) {}</script>
<script src="/vendor/gsap.min.js"></script>
<script>try { window.define = window.__defBak; } catch (e) {}</script>
<script src="/js/reactbits/target-cursor.js" defer></script>
<script src="/js/reactbits/magic-bento.js" defer></script>
<script src="/js/reactbits/init.js" defer></script>
</body>
</html>
